name: Redmi 9A - Stock Boot Inspector

on:
  workflow_dispatch:

jobs:
  inspect-stock-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            curl \
            file \
            binwalk \
            xz-utils \
            gzip \
            tar \
            unzip \
            python3

      - name: Download official Xiaomi ROM
        run: |
          mkdir -p work

          URL="https://bigota.d.miui.com/V12.5.9.0.RCDINXM/dandelion_in_global_images_V12.5.9.0.RCDINXM_20220915.0000.00_11.0_in_921f22da4d.tgz"

          echo "Downloading official Xiaomi ROM..."
          echo "$URL"

          wget \
            --progress=dot:giga \
            --show-progress \
            --tries=5 \
            --timeout=60 \
            -O work/rom.tgz \
            "$URL"

          echo
          echo "=== FILE ==="
          ls -lh work/rom.tgz
          file work/rom.tgz

      - name: Verify MD5
        run: |
          EXPECTED="921f22da4d242430f4ae54999da07b23"
          ACTUAL=$(md5sum work/rom.tgz | awk '{print $1}')

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: MD5 mismatch."
            echo "The downloaded file is not the expected ROM."
            exit 1
          fi

          echo "MD5 verification PASSED."

      - name: Extract ROM
        run: |
          mkdir -p work/rom

          tar -xzf work/rom.tgz \
            -C work/rom

          echo "=== ROM CONTENT ==="
          find work/rom -maxdepth 3 -type f | head -150

      - name: Find stock boot.img
        run: |
          BOOT=$(find work/rom \
            -type f \
            -name "boot.img" \
            | head -1)

          if [ -z "$BOOT" ]; then
            echo "ERROR: boot.img not found."
            exit 1
          fi

          echo "Found stock boot:"
          echo "$BOOT"

          mkdir -p inspection
          cp "$BOOT" inspection/stock-boot.img

      - name: Inspect boot image
        run: |
          BOOT="inspection/stock-boot.img"

          echo "=== FILE TYPE ==="
          file "$BOOT" | tee inspection/file.txt

          echo
          echo "=== SIZE ==="
          stat -c '%n: %s bytes' "$BOOT" \
            | tee inspection/size.txt

          echo
          echo "=== BINWALK ==="
          binwalk "$BOOT" \
            | tee inspection/binwalk.txt

      - name: Detect boot signatures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("inspection/stock-boot.img")
          data = p.read_bytes()

          print("Boot image size:", len(data), "bytes")
          print()

          signatures = [
              b"ANDROID!",
              b"VNDRBOOT",
              b"AVB0",
              b"SEANDROIDENFORCE",
          ]

          for sig in signatures:
              pos = data.find(sig)

              if pos >= 0:
                  print(
                      sig.decode(errors="replace"),
                      "found at offset",
                      pos
                  )
              else:
                  print(
                      sig.decode(errors="replace"),
                      "not found"
                  )
          PY

      - name: Extract strings
        run: |
          strings inspection/stock-boot.img \
            | head -300 \
            | tee inspection/strings.txt

      - name: Create summary
        run: |
          {
            echo "================================="
            echo "Redmi 9A Stock Boot Inspection"
            echo "================================="
            echo
            echo "Device: Redmi 9A"
            echo "Codename: dandelion"
            echo "Region: India"
            echo "MIUI: V12.5.9.0.RCDINXM"
            echo "Android: 11"
            echo
            echo "Expected ROM MD5:"
            echo "921f22da4d242430f4ae54999da07b23"
            echo
            echo "Inspection files:"
            ls -lh inspection/
          } > inspection/SUMMARY.txt

          cat inspection/SUMMARY.txt

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: redmi9a-stock-boot-inspection
          path: inspection/
