name: Redmi 9A Stock DT Container Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            device-tree-compiler \
            binwalk \
            file \
            xxd \
            gzip \
            unzip

      - name: Download stock boot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input

          gh run download 33605127291 \
            -n Redmi9A-Stock-Boot-V12.5.9.0-RCDINXM \
            -D input

          echo "=== Downloaded files ==="
          find input -type f -maxdepth 3 -print

      - name: Locate stock boot
        run: |
          BOOT=$(find input -type f -name "*.img" | head -n 1)

          if [ -z "$BOOT" ]; then
            echo "ERROR: stock boot.img not found"
            exit 1
          fi

          cp "$BOOT" stock-boot.img

          echo "Using:"
          ls -lh stock-boot.img
          file stock-boot.img

      - name: Scan complete boot image for FDT signatures
        run: |
          python3 <<'PY'
          data = open("stock-boot.img", "rb").read()

          signatures = {
              b"\xd0\x0d\xfe\xed": "STANDARD_FDT",
              b"\xd7\xb7\xab\x1e": "MEDIATEK_OR_VENDOR_DT"
          }

          with open("boot-signature-scan.txt", "w") as out:
              out.write("Redmi 9A Stock Boot DT Signature Scan\n")
              out.write("=" * 60 + "\n")
              out.write(f"Boot size: {len(data)} bytes\n\n")

              for sig, name in signatures.items():
                  offsets = []
                  pos = 0

                  while True:
                      pos = data.find(sig, pos)

                      if pos == -1:
                          break

                      offsets.append(pos)
                      pos += 1

                  out.write(f"{name} {sig.hex()}\n")
                  out.write(f"Count: {len(offsets)}\n")

                  for off in offsets:
                      out.write(
                          f"  offset=0x{off:X} ({off})\n"
                      )

                  out.write("\n")

          print(open("boot-signature-scan.txt").read())
          PY

      - name: Analyze possible FDT candidates
        run: |
          mkdir -p fdt-candidates

          python3 <<'PY'
          import struct
          import os

          data = open("stock-boot.img", "rb").read()
          magic = b"\xd0\x0d\xfe\xed"

          candidates = []
          pos = 0

          while True:
              pos = data.find(magic, pos)

              if pos == -1:
                  break

              if pos + 40 <= len(data):
                  try:
                      (
                          f_magic,
                          totalsize,
                          off_dt_struct,
                          off_dt_strings,
                          off_mem_rsvmap,
                          version,
                          last_comp_version,
                          boot_cpuid_phys,
                          size_dt_strings,
                          size_dt_struct
                      ) = struct.unpack_from(">10I", data, pos)

                      valid = (
                          totalsize >= 40 and
                          totalsize <= len(data) - pos and
                          off_dt_struct < totalsize and
                          off_dt_strings < totalsize and
                          version >= 1 and
                          version <= 20
                      )

                      candidates.append({
                          "offset": pos,
                          "totalsize": totalsize,
                          "off_dt_struct": off_dt_struct,
                          "off_dt_strings": off_dt_strings,
                          "off_mem_rsvmap": off_mem_rsvmap,
                          "version": version,
                          "last_comp_version": last_comp_version,
                          "size_dt_strings": size_dt_strings,
                          "size_dt_struct": size_dt_struct,
                          "valid": valid
                      })

                      if valid:
                          name = f"candidate_{pos:08X}.dtb"
                          with open(
                              os.path.join("fdt-candidates", name),
                              "wb"
                          ) as f:
                              f.write(data[pos:pos + totalsize])

                  except Exception as e:
                      print("Parse error at", hex(pos), e)

              pos += 1

          with open("fdt-candidates.txt", "w") as out:
              out.write("Standard FDT Candidate Analysis\n")
              out.write("=" * 70 + "\n\n")

              if not candidates:
                  out.write("NO d00dfeed signatures found.\n")
              else:
                  for c in candidates:
                      out.write(
                          f"Offset: 0x{c['offset']:X}\n"
                          f"Total size: {c['totalsize']}\n"
                          f"Version: {c['version']}\n"
                          f"Last compatible version: {c['last_comp_version']}\n"
                          f"Structure offset: 0x{c['off_dt_struct']:X}\n"
                          f"Strings offset: 0x{c['off_dt_strings']:X}\n"
                          f"Structure size: {c['size_dt_struct']}\n"
                          f"Strings size: {c['size_dt_strings']}\n"
                          f"VALID: {c['valid']}\n"
                          + "-" * 70 + "\n"
                      )

          print(open("fdt-candidates.txt").read())
          PY

      - name: Validate extracted FDT candidates
        run: |
          {
            echo "FDT validation"
            echo "=============="
          } > fdt-validation.txt

          shopt -s nullglob

          files=(fdt-candidates/*.dtb)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No valid FDT candidates extracted." | tee -a fdt-validation.txt
          else
            for dtb in "${files[@]}"; do
              echo "" | tee -a fdt-validation.txt
              echo "FILE: $dtb" | tee -a fdt-validation.txt

              dtc -I dtb -O dts "$dtb" \
                -o "${dtb%.dtb}.dts" \
                2>&1 | tee -a fdt-validation.txt || true
            done
          fi

      - name: Inspect MediaTek/vendor DT magic
        run: |
          python3 <<'PY'
          import struct

          data = open("stock-boot.img", "rb").read()
          magic = b"\xd7\xb7\xab\x1e"

          with open("mediatek-dt-analysis.txt", "w") as out:
              out.write("MediaTek/Vendor DT Signature Analysis\n")
              out.write("=" * 70 + "\n")

              pos = 0
              count = 0

              while True:
                  pos = data.find(magic, pos)

                  if pos == -1:
                      break

                  count += 1

                  out.write(f"\nOccurrence #{count}\n")
                  out.write(f"Offset: 0x{pos:X} ({pos})\n")

                  chunk = data[pos:pos + 128]

                  out.write("Hex dump:\n")

                  for i in range(0, len(chunk), 16):
                      row = chunk[i:i+16]
                      out.write(
                          f"{pos+i:08X}: "
                          + " ".join(f"{b:02X}" for b in row)
                          + "\n"
                      )

                  if pos + 64 <= len(data):
                      words = struct.unpack_from(
                          ">16I",
                          data,
                          pos
                      )

                      out.write("\nBig-endian 32-bit words:\n")

                      for i, word in enumerate(words):
                          out.write(
                              f"+0x{i*4:02X}: 0x{word:08X} ({word})\n"
                          )

                  pos += 1

              out.write(
                  f"\nTotal {magic.hex()} occurrences: {count}\n"
              )

          print(open("mediatek-dt-analysis.txt").read())
          PY

      - name: Analyze stock DT region
        run: |
          python3 <<'PY'
          data = open("stock-boot.img", "rb").read()

          start = 0xD20000
          end = min(len(data), 0xD50000)

          with open("stock-dt-region.bin", "wb") as f:
              f.write(data[start:end])

          with open("stock-dt-region-info.txt", "w") as f:
              f.write("Stock DT region inspection\n")
              f.write("==========================\n")
              f.write(f"Start: 0x{start:X}\n")
              f.write(f"End:   0x{end:X}\n")
              f.write(f"Size:  {end-start} bytes\n")
              f.write(f"First 64 bytes: {data[start:start+64].hex()}\n")

          print(open("stock-dt-region-info.txt").read())
          PY

      - name: Binwalk stock boot
        run: |
          binwalk stock-boot.img > binwalk-stock-boot.txt || true

      - name: Hash everything
        run: |
          sha256sum \
            stock-boot.img \
            stock-dt-region.bin \
            boot-signature-scan.txt \
            fdt-candidates.txt \
            mediatek-dt-analysis.txt \
            binwalk-stock-boot.txt \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Package analysis
        run: |
          mkdir -p Redmi9A-DT-Container-Analysis

          cp stock-boot.img \
             Redmi9A-DT-Container-Analysis/

          cp stock-dt-region.bin \
             Redmi9A-DT-Container-Analysis/

          cp boot-signature-scan.txt \
             Redmi9A-DT-Container-Analysis/

          cp fdt-candidates.txt \
             Redmi9A-DT-Container-Analysis/

          cp fdt-validation.txt \
             Redmi9A-DT-Container-Analysis/

          cp mediatek-dt-analysis.txt \
             Redmi9A-DT-Container-Analysis/

          cp stock-dt-region-info.txt \
             Redmi9A-DT-Container-Analysis/

          cp binwalk-stock-boot.txt \
             Redmi9A-DT-Container-Analysis/

          cp SHA256SUMS.txt \
             Redmi9A-DT-Container-Analysis/

          cp -r fdt-candidates \
             Redmi9A-DT-Container-Analysis/ || true

          zip -r \
            Redmi9A-DT-Container-Analysis.zip \
            Redmi9A-DT-Container-Analysis

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-DT-Container-Analysis
          path: Redmi9A-DT-Container-Analysis.zip
          retention-days: 14
