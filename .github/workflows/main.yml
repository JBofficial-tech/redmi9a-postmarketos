name: Redmi 9A Kernel DTB Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            cpio \
            rsync

      - name: Clone kernel source
        run: |
          git clone \
            --depth=1 \
            --branch mt6765 \
            https://github.com/dandelion64-Archives/linux-mt6762-garden.git \
            kernel

      - name: Inspect device tree
        working-directory: kernel
        run: |
          echo "=== DTS files ==="
          find arch/arm64/boot/dts -type f | sort | grep -Ei \
            'dandelion|garden|mt6762|mt6765' || true

          echo "=== ARM64 configs ==="
          find arch/arm64/configs -maxdepth 1 -type f | sort | grep -Ei \
            'dandelion|garden|mt6762|mt6765' || true

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out ARCH=arm64 defconfig

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image \
            dtbs

      - name: Collect build output
        run: |
          mkdir -p artifacts

          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image artifacts/
          fi

          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz artifacts/
          fi

          if [ -f kernel/out/.config ]; then
            cp kernel/out/.config artifacts/kernel.config
          fi

          find kernel/out/arch/arm64/boot/dts \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -print \
            -exec cp --parents {} artifacts/ \; || true

          echo "=== FINAL ARTIFACTS ==="
          find artifacts -type f -print

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redmi9a-kernel-dtb
          path: artifacts
