name: Redmi 9A - Dandelion DTB Build

on:
  workflow_dispatch:

jobs:
  build-dandelion-dtb:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm

      - name: Clone kernel source
        run: |
          git clone \
            --depth=1 \
            --branch mt6765 \
            https://github.com/dandelion64-Archives/linux-mt6762-garden.git \
            kernel

      - name: Verify Redmi 9A DTS
        working-directory: kernel
        run: |
          test -f arch/arm64/boot/dts/mediatek/mt6762g-xiaomi-dandelion.dts

          echo "Redmi 9A DTS found:"
          echo "arch/arm64/boot/dts/mediatek/mt6762g-xiaomi-dandelion.dts"

          echo
          echo "DTS references:"
          grep -nE 'compatible|model|include' \
            arch/arm64/boot/dts/mediatek/mt6762g-xiaomi-dandelion.dts \
            | head -100

      - name: Configure kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out ARCH=arm64 defconfig

      - name: Build Redmi 9A DTB
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            dtbs

          test -f \
            out/arch/arm64/boot/dts/mediatek/mt6762g-xiaomi-dandelion.dtb

      - name: Validate Redmi 9A DTB
        working-directory: kernel
        run: |
          DTB="out/arch/arm64/boot/dts/mediatek/mt6762g-xiaomi-dandelion.dtb"

          echo "DTB:"
          ls -lh "$DTB"

          echo
          echo "DTB header:"
          file "$DTB"

          echo
          echo "DTB compatible strings:"
          dtc -I dtb -O dts "$DTB" 2>/dev/null \
            | grep -E 'compatible|model' \
            | head -30 || true

      - name: Collect artifacts
        run: |
          mkdir -p artifacts

          cp \
            kernel/out/arch/arm64/boot/dts/mediatek/mt6762g-xiaomi-dandelion.dtb \
            artifacts/dandelion.dtb

          cp \
            kernel/out/arch/arm64/boot/Image \
            artifacts/Image \
            2>/dev/null || true

          cp \
            kernel/out/.config \
            artifacts/kernel.config \
            2>/dev/null || true

          echo "=== FINAL OUTPUT ==="
          ls -lah artifacts

      - name: Upload Redmi 9A artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redmi9a-dandelion-dtb
          path: artifacts/
