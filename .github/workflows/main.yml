name: Redmi 9A DT Deep Analysis v2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            device-tree-compiler \
            python3 \
            file \
            binutils \
            unzip

      # ==================================================
      # STOCK DT ARTIFACT
      # ==================================================

      - name: Download stock DT artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stock-download

          gh run download 33856392991 \
            -n Redmi9A-Stock-DT-Extracted \
            -D stock-download

          echo "=== DOWNLOADED STOCK ARTIFACT ==="
          find stock-download -type f -print

      - name: Extract stock artifact ZIP
        run: |
          mkdir -p stock

          ZIP=$(find stock-download \
            -type f \
            -name "*.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Stock artifact ZIP not found"
            find stock-download -type f -print
            exit 1
          fi

          echo "Extracting:"
          echo "$ZIP"

          unzip -o "$ZIP" -d stock

          echo
          echo "=== STOCK FILES ==="
          find stock -type f -print

      - name: Locate stock DTS
        run: |
          STOCK_DTS=$(find stock \
            -type f \
            -name "stock-dandelion.dts" \
            | head -n 1)

          if [ -z "$STOCK_DTS" ]; then
            echo "ERROR: stock-dandelion.dts not found"
            echo
            echo "All DTS files:"
            find stock -type f -name "*.dts" -print
            exit 1
          fi

          cp "$STOCK_DTS" stock.dts

          echo "Stock DTS found:"
          echo "$STOCK_DTS"

      - name: Locate stock DTB
        run: |
          STOCK_DTB=$(find stock \
            -type f \
            -name "stock-dandelion.dtb" \
            | head -n 1)

          if [ -z "$STOCK_DTB" ]; then
            echo "ERROR: stock-dandelion.dtb not found"
            echo
            echo "All DTB files:"
            find stock -type f -name "*.dtb" -print
            exit 1
          fi

          cp "$STOCK_DTB" stock.dtb

          echo "Stock DTB found:"
          file stock.dtb
          ls -lh stock.dtb

      # ==================================================
      # FIND MAINLINE ARTIFACT
      # ==================================================

      - name: List available artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]
              | select(.expired == false)
              | [.id, .name, .created_at]
              | @tsv' \
            | tee artifacts-list.txt

      - name: Select mainline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== SEARCHING ARTIFACTS ==="

          ARTIFACT_ID=$(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[]
                | select(.expired == false)
                | select(
                    .name == "Redmi9A-pmOS-Package-Analysis"
                  )
                | .id' \
              | head -n 1
          )

          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: Redmi9A-pmOS-Package-Analysis artifact not found"
            echo
            echo "Available artifacts:"
            cat artifacts-list.txt
            exit 1
          fi

          echo "Selected artifact ID:"
          echo "$ARTIFACT_ID"

          echo "$ARTIFACT_ID" > mainline-artifact-id.txt

      - name: Download mainline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p mainline-download

          ARTIFACT_ID=$(cat mainline-artifact-id.txt)

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > mainline-artifact.zip

          unzip -o mainline-artifact.zip \
            -d mainline-download

          echo "=== MAINLINE OUTER FILES ==="
          find mainline-download -type f -print

      - name: Extract mainline nested ZIP
        run: |
          mkdir -p mainline

          ZIP=$(find mainline-download \
            -type f \
            -name "*.zip" \
            | head -n 1)

          if [ -n "$ZIP" ]; then
            echo "Nested ZIP found:"
            echo "$ZIP"

            unzip -o "$ZIP" -d mainline
          else
            echo "No nested ZIP found."
            cp -r mainline-download/* mainline/ 2>/dev/null || true
          fi

          echo
          echo "=== MAINLINE FILES ==="
          find mainline -type f -print

      # ==================================================
      # LOCATE MAINLINE DTB
      # ==================================================

      - name: Locate mainline dandelion DTB
        run: |
          MAINLINE_DTB=$(
            find mainline \
              -type f \
              \( \
                -name "dandelion.dtb" \
                -o \
                -name "mt6762g-xiaomi-dandelion.dtb" \
              \) \
              | head -n 1
          )

          if [ -z "$MAINLINE_DTB" ]; then
            echo "ERROR: Mainline dandelion DTB not found"

            echo
            echo "All DTBs:"
            find mainline \
              -type f \
              -name "*.dtb" \
              -print

            exit 1
          fi

          cp "$MAINLINE_DTB" mainline.dtb

          echo "Mainline DTB:"
          echo "$MAINLINE_DTB"

          file mainline.dtb
          ls -lh mainline.dtb

      # ==================================================
      # DECOMPILE MAINLINE DTB
      # ==================================================

      - name: Decompile mainline DTB
        run: |
          dtc \
            -I dtb \
            -O dts \
            mainline.dtb \
            -o mainline.dts \
            2>&1 | tee mainline-dtc.log || true

          if [ ! -s mainline.dts ]; then
            echo "ERROR: mainline DTS generation failed"
            exit 1
          fi

          echo "Mainline DTS generated successfully."

      # ==================================================
      # DTB HEADERS
      # ==================================================

      - name: Inspect DTB headers
        run: |
          python3 <<'PY'
          import struct

          def inspect(path):
              data = open(path, "rb").read()

              print()
              print("=" * 60)
              print(path)
              print("=" * 60)

              if len(data) < 40:
                  print("Too small")
                  return

              vals = struct.unpack_from(">10I", data, 0)

              (
                  magic,
                  totalsize,
                  off_struct,
                  off_strings,
                  off_rsvmap,
                  version,
                  last_version,
                  boot_cpu,
                  size_strings,
                  size_struct
              ) = vals

              print(f"Magic            : 0x{magic:08X}")
              print(f"Total size       : {totalsize}")
              print(f"Structure offset : 0x{off_struct:X}")
              print(f"Strings offset   : 0x{off_strings:X}")
              print(f"Reserve map      : 0x{off_rsvmap:X}")
              print(f"Version          : {version}")
              print(f"Last version     : {last_version}")
              print(f"Boot CPU         : {boot_cpu}")
              print(f"Strings size     : {size_strings}")
              print(f"Structure size   : {size_struct}")

          inspect("stock.dtb")
          inspect("mainline.dtb")
          PY

      # ==================================================
      # IDENTITY
      # ==================================================

      - name: Compare device identity
        run: |
          {
            echo "=========================================="
            echo "DEVICE IDENTITY"
            echo "=========================================="

            echo
            echo "=== STOCK ==="

            grep -inE \
              'model =|compatible =|bootargs|dandelion|xiaomi|mt6762|mt6765' \
              stock.dts \
              | head -200 || true

            echo
            echo "=== MAINLINE ==="

            grep -inE \
              'model =|compatible =|bootargs|dandelion|xiaomi|mt6762|mt6765' \
              mainline.dts \
              | head -200 || true

          } | tee identity.txt

      # ==================================================
      # HARDWARE COMPARISON
      # ==================================================

      - name: Compare important hardware
        run: |
          {
            for pattern in \
              'uart' \
              'serial' \
              'mmc' \
              'msdc' \
              'pinctrl' \
              'gpio' \
              'i2c' \
              'spi' \
              'usb' \
              'xhci' \
              'display' \
              'dsi' \
              'drm' \
              'panel' \
              'backlight' \
              'touch' \
              'battery' \
              'charger' \
              'pmic' \
              'mt6357' \
              'regulator' \
              'clock' \
              'clk' \
              'watchdog' \
              'wdt' \
              'thermal' \
              'gpu' \
              'wifi' \
              'wlan' \
              'bluetooth' \
              'camera' \
              'sensor' \
              'reserved-memory' \
              'memory@' \
              'chosen'
            do

              echo
              echo "########################################"
              echo "PATTERN: $pattern"
              echo "########################################"

              echo "--- STOCK ---"

              grep -inE "$pattern" \
                stock.dts \
                | head -80 || true

              echo "--- MAINLINE ---"

              grep -inE "$pattern" \
                mainline.dts \
                | head -80 || true

            done

          } | tee important-hardware.txt

      # ==================================================
      # COMPATIBLE STRINGS
      # ==================================================

      - name: Compare compatible strings
        run: |
          grep -oE \
            'compatible = "[^"]+"' \
            stock.dts \
            | sort -u \
            > stock-compatible.txt

          grep -oE \
            'compatible = "[^"]+"' \
            mainline.dts \
            | sort -u \
            > mainline-compatible.txt

          comm -23 \
            stock-compatible.txt \
            mainline-compatible.txt \
            > stock-only-compatible.txt || true

          comm -13 \
            stock-compatible.txt \
            mainline-compatible.txt \
            > mainline-only-compatible.txt || true

      # ==================================================
      # NODE COMPARISON
      # ==================================================

      - name: Compare DT nodes
        run: |
          python3 <<'PY'
          import re

          def get_nodes(path):
              result = set()

              for line in open(path, errors="ignore"):
                  line = line.strip()

                  if not line or line.startswith("//"):
                      continue

                  line = re.sub(
                      r'^[A-Za-z0-9_]+:\s*',
                      '',
                      line
                  )

                  m = re.match(
                      r'([A-Za-z0-9_.,+@\-]+)\s*\{',
                      line
                  )

                  if m:
                      result.add(m.group(1))

              return sorted(result)

          stock = get_nodes("stock.dts")
          mainline = get_nodes("mainline.dts")

          open("stock-nodes.txt", "w").write(
              "\n".join(stock) + "\n"
          )

          open("mainline-nodes.txt", "w").write(
              "\n".join(mainline) + "\n"
          )

          print("Stock nodes:", len(stock))
          print("Mainline nodes:", len(mainline))
          PY

          comm -23 \
            <(sort stock-nodes.txt) \
            <(sort mainline-nodes.txt) \
            > stock-only-nodes.txt || true

          comm -13 \
            <(sort stock-nodes.txt) \
            <(sort mainline-nodes.txt) \
            > mainline-only-nodes.txt || true

      # ==================================================
      # FULL DIFF
      # ==================================================

      - name: Generate DTS diff
        run: |
          diff -u \
            stock.dts \
            mainline.dts \
            > stock-vs-mainline.diff \
            || true

          echo "Diff lines:"
          wc -l stock-vs-mainline.diff

      # ==================================================
      # SUMMARY
      # ==================================================

      - name: Generate summary
        run: |
          {
            echo "=========================================="
            echo "REDMI 9A DT DEEP ANALYSIS"
            echo "=========================================="

            echo
            echo "=== DTB FILES ==="

            ls -lh \
              stock.dtb \
              mainline.dtb

            echo
            echo "=== DTS FILES ==="

            ls -lh \
              stock.dts \
              mainline.dts

            echo
            echo "=== NODE COUNTS ==="

            echo -n "Stock: "
            wc -l < stock-nodes.txt

            echo -n "Mainline: "
            wc -l < mainline-nodes.txt

            echo -n "Stock only: "
            wc -l < stock-only-nodes.txt

            echo -n "Mainline only: "
            wc -l < mainline-only-nodes.txt

          } | tee dt-summary.txt

      # ==================================================
      # PACKAGE
      # ==================================================

      - name: Create report package
        run: |
          mkdir -p Redmi9A-DT-Deep-Analysis

          cp stock.dtb Redmi9A-DT-Deep-Analysis/
          cp mainline.dtb Redmi9A-DT-Deep-Analysis/

          cp stock.dts Redmi9A-DT-Deep-Analysis/
          cp mainline.dts Redmi9A-DT-Deep-Analysis/

          cp mainline-dtc.log Redmi9A-DT-Deep-Analysis/

          cp identity.txt Redmi9A-DT-Deep-Analysis/
          cp important-hardware.txt Redmi9A-DT-Deep-Analysis/

          cp stock-compatible.txt Redmi9A-DT-Deep-Analysis/
          cp mainline-compatible.txt Redmi9A-DT-Deep-Analysis/

          cp stock-only-compatible.txt Redmi9A-DT-Deep-Analysis/
          cp mainline-only-compatible.txt Redmi9A-DT-Deep-Analysis/

          cp stock-nodes.txt Redmi9A-DT-Deep-Analysis/
          cp mainline-nodes.txt Redmi9A-DT-Deep-Analysis/

          cp stock-only-nodes.txt Redmi9A-DT-Deep-Analysis/
          cp mainline-only-nodes.txt Redmi9A-DT-Deep-Analysis/

          cp stock-vs-mainline.diff Redmi9A-DT-Deep-Analysis/
          cp dt-summary.txt Redmi9A-DT-Deep-Analysis/

          cp artifacts-list.txt Redmi9A-DT-Deep-Analysis/

          zip -r \
            Redmi9A-DT-Deep-Analysis.zip \
            Redmi9A-DT-Deep-Analysis

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-DT-Deep-Analysis
          path: Redmi9A-DT-Deep-Analysis.zip
          retention-days: 14
