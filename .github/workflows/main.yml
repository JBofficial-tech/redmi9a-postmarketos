name: Build Redmi 9A pmOS Test Boot

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            unzip \
            gzip \
            file \
            binwalk \
            python3 \
            cpio

      # ---------------------------------------------------------
      # 1. Download STOCK Redmi 9A boot artifact
      # ---------------------------------------------------------
      - name: Download stock boot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p stock

          echo "Downloading verified stock boot artifact..."

          gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/9842100784/zip \
            > stock/artifact.zip

          unzip -o stock/artifact.zip -d stock

          echo "Stock files:"
          find stock -type f -maxdepth 3 -print

          STOCK=$(find stock -type f -name "stock-boot.img" | head -n1)

          if [ -z "$STOCK" ]; then
            echo "ERROR: stock-boot.img not found"
            exit 1
          fi

          cp "$STOCK" stock-boot.img

          echo "Stock boot:"
          ls -lh stock-boot.img
          file stock-boot.img

      # ---------------------------------------------------------
      # 2. Build kernel
      # ---------------------------------------------------------
      - name: Build Redmi 9A kernel and DTB
  working-directory: kernel
  run: |
    set -e

    export ARCH=arm64

    make O=out mt6765_defconfig

    # Redmi 9A device tree
    make -j"$(nproc)" O=out \
      Image \
      mediatek/mt6762g-xiaomi-dandelion.dtb

    echo "=== BUILD OUTPUT ==="
    ls -lh out/arch/arm64/boot/Image
    ls -lh out/arch/arm64/boot/dts/mediatek/mt6762g-xiaomi-dandelion.dtb

      # ---------------------------------------------------------
      # 3. Copy required components
      # ---------------------------------------------------------
      - name: Prepare components
        run: |
          set -e

          mkdir -p work

          cp kernel/out/arch/arm64/boot/Image \
            work/Image

          cp kernel/out/arch/arm64/boot/dts/mediatek/mt6762g-xiaomi-dandelion.dtb \
            work/dandelion.dtb

          echo "=== COMPONENTS ==="
          file work/Image
          file work/dandelion.dtb
          ls -lh work/

      # ---------------------------------------------------------
      # 4. Install mkbootimg/unpackbootimg
      # ---------------------------------------------------------
      - name: Get Android boot image tools
        run: |
          set -e

          mkdir -p tools

          git clone --depth=1 \
            https://android.googlesource.com/platform/system/tools/mkbootimg \
            tools/mkbootimg

          python3 tools/mkbootimg/mkbootimg.py --help | head -30
          python3 tools/mkbootimg/unpack_bootimg.py --help | head -30

      # ---------------------------------------------------------
      # 5. Inspect STOCK boot image
      # ---------------------------------------------------------
      - name: Unpack stock boot
        run: |
          set -e

          rm -rf stock-unpacked
          mkdir -p stock-unpacked

          python3 tools/mkbootimg/unpack_bootimg.py \
            --boot_img stock-boot.img \
            --out stock-unpacked

          echo "=== STOCK BOOT CONTENTS ==="
          find stock-unpacked -maxdepth 2 -type f -exec ls -lh {} \;

          echo
          echo "=== STOCK HEADER ==="

          cat stock-unpacked/bootimg.cfg || true

      # ---------------------------------------------------------
      # 6. Show exact stock structure
      # ---------------------------------------------------------
      - name: Verify stock structure
        run: |
          set -e

          echo "================================"
          echo "STOCK BOOT VERIFICATION"
          echo "================================"

          echo
          echo "--- IMAGE ---"
          ls -lh stock-boot.img

          echo
          echo "--- UNPACKED FILES ---"
          find stock-unpacked -type f -printf '%p %s bytes\n'

          echo
          echo "--- BINWALK ---"
          binwalk stock-boot.img || true

          echo
          echo "--- KERNEL ---"
          file stock-unpacked/kernel || true

          echo
          echo "--- RAMDISK ---"
          file stock-unpacked/ramdisk || true

          echo
          echo "--- DTB ---"
          file stock-unpacked/*.dtb 2>/dev/null || true

      # ---------------------------------------------------------
      # 7. DO NOT automatically flash
      # ---------------------------------------------------------
      - name: Safety check
        run: |
          echo "=========================================="
          echo "SAFETY CHECK"
          echo "=========================================="
          echo
          echo "This workflow DOES NOT flash the device."
          echo
          echo "Stock boot image:"
          sha256sum stock-boot.img
          echo
          echo "New kernel:"
          sha256sum work/Image
          echo
          echo "Redmi 9A DTB:"
          sha256sum work/dandelion.dtb
          echo
          echo "Packaging stage will only create an artifact."
          echo "NO fastboot commands are executed."

      # ---------------------------------------------------------
      # 8. Upload everything for inspection
      # ---------------------------------------------------------
      - name: Upload packaging files
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-pmOS-Test-Components
          path: |
            stock-boot.img
            work/Image
            work/dandelion.dtb
            stock-unpacked/
          if-no-files-found: error
