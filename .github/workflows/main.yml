name: Redmi 9A Stock DT Corrected Extraction

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler binwalk file xxd

      - name: Download stock boot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input

          gh run download 33605127291 \
            -n Redmi9A-Stock-Boot-V12.5.9.0-RCDINXM \
            -D input

          BOOT=$(find input -type f -name "*.img" | head -n 1)

          if [ -z "$BOOT" ]; then
            echo "ERROR: stock boot.img not found"
            exit 1
          fi

          cp "$BOOT" stock-boot.img

          echo "=== STOCK BOOT ==="
          ls -lh stock-boot.img
          file stock-boot.img

      - name: Locate vendor DT container
        run: |
          python3 <<'PY'
          import struct

          data = open("stock-boot.img", "rb").read()

          magic = b"\xd7\xb7\xab\x1e"

          offsets = []
          pos = 0

          while True:
              pos = data.find(magic, pos)

              if pos == -1:
                  break

              offsets.append(pos)
              pos += 1

          print("Vendor DT magic occurrences:")

          for x in offsets:
              print(f"0x{x:X} ({x})")

          if not offsets:
              raise SystemExit("ERROR: d7b7ab1e not found")

          # Known stock Redmi 9A DT container.
          container_start = offsets[0]
          container_size = 133668

          container_end = container_start + container_size

          if container_end > len(data):
              raise SystemExit("ERROR: DT container outside boot image")

          container = data[container_start:container_end]

          open("stock-dt-container.bin", "wb").write(container)

          print()
          print(f"Container start : 0x{container_start:X}")
          print(f"Container end   : 0x{container_end:X}")
          print(f"Container size  : {len(container)}")
          PY

      - name: Scan DT container for real FDT
        run: |
          python3 <<'PY'
          import struct

          data = open("stock-dt-container.bin", "rb").read()

          magic = b"\xd0\x0d\xfe\xed"

          positions = []
          pos = 0

          while True:
              pos = data.find(magic, pos)

              if pos == -1:
                  break

              positions.append(pos)
              pos += 1

          print("=== FDT SIGNATURES INSIDE DT CONTAINER ===")

          for p in positions:
              print(f"FDT candidate: container offset 0x{p:X}")

          if not positions:
              raise SystemExit(
                  "ERROR: No d00dfeed found inside DT container"
              )

          with open("fdt-candidates.txt", "w") as report:
              report.write(
                  "FDT candidates inside Redmi 9A stock DT container\n"
              )
              report.write("=" * 70 + "\n\n")

              for p in positions:

                  report.write(f"Candidate offset: 0x{p:X}\n")

                  if p + 40 > len(data):
                      report.write("Not enough bytes for FDT header\n\n")
                      continue

                  vals = struct.unpack_from(
                      ">10I",
                      data,
                      p
                  )

                  (
                      magic_value,
                      totalsize,
                      off_dt_struct,
                      off_dt_strings,
                      off_mem_rsvmap,
                      version,
                      last_comp_version,
                      boot_cpuid_phys,
                      size_dt_strings,
                      size_dt_struct
                  ) = vals

                  report.write(
                      f"magic             : 0x{magic_value:08X}\n"
                      f"totalsize         : {totalsize}\n"
                      f"off_dt_struct     : 0x{off_dt_struct:X}\n"
                      f"off_dt_strings    : 0x{off_dt_strings:X}\n"
                      f"off_mem_rsvmap    : 0x{off_mem_rsvmap:X}\n"
                      f"version           : {version}\n"
                      f"last_comp_version : {last_comp_version}\n"
                      f"boot_cpuid_phys   : {boot_cpuid_phys}\n"
                      f"size_dt_strings   : {size_dt_strings}\n"
                      f"size_dt_struct    : {size_dt_struct}\n"
                  )

                  valid = (
                      totalsize >= 40 and
                      p + totalsize <= len(data) and
                      off_dt_struct < totalsize and
                      off_dt_strings < totalsize and
                      version >= 1 and
                      version <= 20
                  )

                  report.write(f"VALID HEADER: {valid}\n\n")

          print(open("fdt-candidates.txt").read())
          PY

      - name: Extract every valid FDT
        run: |
          mkdir -p extracted-fdts

          python3 <<'PY'
          import struct
          import os

          data = open("stock-dt-container.bin", "rb").read()

          magic = b"\xd0\x0d\xfe\xed"

          pos = 0
          count = 0

          while True:
              pos = data.find(magic, pos)

              if pos == -1:
                  break

              if pos + 40 <= len(data):

                  (
                      f_magic,
                      totalsize,
                      off_dt_struct,
                      off_dt_strings,
                      off_mem_rsvmap,
                      version,
                      last_comp_version,
                      boot_cpuid_phys,
                      size_dt_strings,
                      size_dt_struct
                  ) = struct.unpack_from(
                      ">10I",
                      data,
                      pos
                  )

                  valid = (
                      totalsize >= 40 and
                      pos + totalsize <= len(data) and
                      off_dt_struct < totalsize and
                      off_dt_strings < totalsize and
                      version >= 1 and
                      version <= 20
                  )

                  if valid:

                      count += 1

                      name = (
                          f"fdt_{count:02d}_"
                          f"container_0x{pos:X}.dtb"
                      )

                      output = os.path.join(
                          "extracted-fdts",
                          name
                      )

                      with open(output, "wb") as f:
                          f.write(
                              data[pos:pos + totalsize]
                          )

                      print(
                          f"Extracted {output} "
                          f"size={totalsize}"
                      )

              pos += 1

          if count == 0:
              raise SystemExit(
                  "ERROR: No valid FDT extracted"
              )

          print(f"Total valid FDTs: {count}")
          PY

      - name: Validate extracted DTBs
        run: |
          : > dtc-validation.txt

          for dtb in extracted-fdts/*.dtb; do

            echo "========================================" \
              | tee -a dtc-validation.txt

            echo "FILE: $dtb" \
              | tee -a dtc-validation.txt

            echo "========================================" \
              | tee -a dtc-validation.txt

            file "$dtb" \
              | tee -a dtc-validation.txt

            dtc \
              -I dtb \
              -O dts \
              "$dtb" \
              -o "${dtb%.dtb}.dts" \
              2>&1 \
              | tee -a dtc-validation.txt || true

            echo \
              | tee -a dtc-validation.txt

          done

      - name: Inspect first valid DTB
        run: |
          FIRST=$(find extracted-fdts \
            -type f \
            -name "*.dtb" \
            | sort \
            | head -n 1)

          if [ -z "$FIRST" ]; then
            echo "No extracted DTB"
            exit 1
          fi

          cp "$FIRST" stock-dandelion.dtb

          echo "Selected:"
          echo "$FIRST"

          ls -lh stock-dandelion.dtb

      - name: Inspect DTB identity
        run: |
          FIRST_DTS=$(find extracted-fdts \
            -type f \
            -name "*.dts" \
            | sort \
            | head -n 1)

          if [ -z "$FIRST_DTS" ]; then
            echo "No DTS generated"
            exit 1
          fi

          cp "$FIRST_DTS" stock-dandelion.dts

          {
            echo "=== DEVICE IDENTITY ==="
            echo

            grep -inE \
              'model|compatible|xiaomi|dandelion|mt6762|mt6765' \
              stock-dandelion.dts \
              | head -200 || true

            echo
            echo "=== CPU ==="

            grep -inE \
              'cpu@|cpus' \
              stock-dandelion.dts \
              | head -100 || true

            echo
            echo "=== MEMORY ==="

            grep -inE \
              'memory@|device_type.*memory|reg =' \
              stock-dandelion.dts \
              | head -150 || true

          } > stock-dtb-identity.txt

          cat stock-dtb-identity.txt

      - name: Dump DT container header bytes
        run: |
          xxd -g 1 -l 128 stock-dt-container.bin \
            > dt-container-header-hex.txt

          cat dt-container-header-hex.txt

      - name: Search strings in stock DTB
        run: |
          strings -a stock-dandelion.dtb \
            > stock-dtb-strings.txt

          grep -inE \
            'dandelion|xiaomi|mt6762|mt6765|mediatek|boot|memory|chosen' \
            stock-dtb-strings.txt \
            | head -300 \
            > stock-dtb-relevant-strings.txt || true

          cat stock-dtb-relevant-strings.txt

      - name: SHA256
        run: |
          sha256sum \
            stock-boot.img \
            stock-dt-container.bin \
            stock-dandelion.dtb \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Create final package
        run: |
          mkdir -p Redmi9A-Stock-DT-Extracted

          cp stock-boot.img \
            Redmi9A-Stock-DT-Extracted/

          cp stock-dt-container.bin \
            Redmi9A-Stock-DT-Extracted/

          cp stock-dandelion.dtb \
            Redmi9A-Stock-DT-Extracted/

          cp stock-dandelion.dts \
            Redmi9A-Stock-DT-Extracted/

          cp fdt-candidates.txt \
            Redmi9A-Stock-DT-Extracted/

          cp dtc-validation.txt \
            Redmi9A-Stock-DT-Extracted/

          cp stock-dtb-identity.txt \
            Redmi9A-Stock-DT-Extracted/

          cp stock-dtb-strings.txt \
            Redmi9A-Stock-DT-Extracted/

          cp stock-dtb-relevant-strings.txt \
            Redmi9A-Stock-DT-Extracted/

          cp dt-container-header-hex.txt \
            Redmi9A-Stock-DT-Extracted/

          cp SHA256SUMS.txt \
            Redmi9A-Stock-DT-Extracted/

          cp -r extracted-fdts \
            Redmi9A-Stock-DT-Extracted/

          zip -r \
            Redmi9A-Stock-DT-Extracted.zip \
            Redmi9A-Stock-DT-Extracted

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-Stock-DT-Extracted
          path: Redmi9A-Stock-DT-Extracted.zip
          retention-days: 14
