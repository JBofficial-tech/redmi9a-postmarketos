name: Redmi 9A - Device Tree Investigation

on:
  workflow_dispatch:

jobs:
  inspect-dandelion:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            lld \
            llvm \
            device-tree-compiler

      - name: Clone kernel source
        run: |
          git clone \
            --depth=1 \
            --branch mt6765 \
            https://github.com/dandelion64-Archives/linux-mt6762-garden.git \
            kernel

      - name: Inspect kernel device trees
        working-directory: kernel
        run: |
          echo "======================================"
          echo "Searching for Redmi 9A / dandelion"
          echo "======================================"

          find arch/arm64/boot/dts \
            -type f \
            \( -name "*.dts" -o -name "*.dtsi" \) \
            -print | \
            grep -Ei \
            'dandelion|dandelion64|redmi.?9a|xiaomi' || true

          echo
          echo "======================================"
          echo "Searching for Redmi / Xiaomi references"
          echo "======================================"

          grep -RniE \
            'dandelion|redmi 9a|redmi9a|xiaomi,dandelion|xiaomi.*9a' \
            arch/arm64/boot/dts 2>/dev/null | \
            head -200 || true

          echo
          echo "======================================"
          echo "MT6762 / MT6765 DTS files"
          echo "======================================"

          find arch/arm64/boot/dts \
            -type f \
            \( -name "*.dts" -o -name "*.dtsi" \) | \
            grep -Ei 'mt6762|mt6765' | \
            sort || true

      - name: Search device-tree Makefiles
        working-directory: kernel
        run: |
          echo "======================================"
          echo "Relevant Makefile entries"
          echo "======================================"

          grep -RniE \
            'dandelion|angelican|mt6762|mt6765' \
            arch/arm64/boot/dts/Makefile \
            arch/arm64/boot/dts/mediatek/Makefile \
            2>/dev/null || true

      - name: Search compatible strings
        working-directory: kernel
        run: |
          echo "======================================"
          echo "Relevant compatible strings"
          echo "======================================"

          grep -RniE \
            'mediatek,mt6762|mediatek,mt6765|xiaomi' \
            arch/arm64/boot/dts/mediatek \
            2>/dev/null | \
            head -250 || true

      - name: Save investigation report
        working-directory: kernel
        run: |
          mkdir -p ../report

          {
            echo "Redmi 9A Device Tree Investigation"
            echo
            echo "Kernel commit:"
            git log -1 --oneline
            echo

            echo "Possible dandelion/Xiaomi DTS files:"
            find arch/arm64/boot/dts \
              -type f \
              \( -name "*.dts" -o -name "*.dtsi" \) | \
              grep -Ei \
              'dandelion|dandelion64|redmi.?9a|xiaomi' || true

            echo
            echo "MT6762/MT6765 DTS files:"
            find arch/arm64/boot/dts \
              -type f \
              \( -name "*.dts" -o -name "*.dtsi" \) | \
              grep -Ei 'mt6762|mt6765' | \
              sort || true
          } > ../report/device-tree-report.txt

      - name: Upload investigation report
        uses: actions/upload-artifact@v4
        with:
          name: redmi9a-device-tree-report
          path: report/device-tree-report.txt
