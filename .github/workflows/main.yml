name: Redmi 9A Dandelion DTB Deep Compare

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            device-tree-compiler \
            unzip \
            file \
            binutils

      - name: Download stock boot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input

          gh run download 33605127291 \
            -n Redmi9A-Stock-Boot-V12.5.9.0-RCDINXM \
            -D input

          BOOT=$(find input -type f -name "*.img" | head -n 1)

          if [ -z "$BOOT" ]; then
            echo "ERROR: stock boot.img not found"
            exit 1
          fi

          cp "$BOOT" stock-boot.img

      - name: Download successful dandelion kernel artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p kernel-artifact

          echo "Searching recent successful workflow artifacts..."

          gh run list \
            --limit 30 \
            --json databaseId,status,conclusion,name \
            > runs.json

          cat runs.json

          # Try known successful artifact workflow/run if available
          FOUND=""

          for RUN in $(python3 - <<'PY'
          import json

          data=json.load(open("runs.json"))

          for r in data:
              if r.get("status") == "completed" and r.get("conclusion") == "success":
                  print(r["databaseId"])
          PY
          ); do

            echo "Checking run: $RUN"

            if gh run download "$RUN" -D kernel-artifact 2>/dev/null; then
              if find kernel-artifact -type f \( \
                  -name "dandelion.dtb" \
                  -o -name "mt6762g-xiaomi-dandelion.dtb" \
                  \) | grep -q .; then
                FOUND="$RUN"
                break
              fi
            fi

            rm -rf kernel-artifact
            mkdir -p kernel-artifact
          done

          if [ -z "$FOUND" ]; then
            echo "ERROR: Could not automatically find dandelion DTB artifact."
            echo "Please ensure the previous successful dandelion DTB build artifact exists."
            exit 1
          fi

          echo "Found DTB from run: $FOUND"

          find kernel-artifact -type f -print

      - name: Locate dandelion DTB
        run: |
          DTB=$(find kernel-artifact -type f \
            \( -name "dandelion.dtb" \
            -o -name "mt6762g-xiaomi-dandelion.dtb" \
            \) | head -n 1)

          if [ -z "$DTB" ]; then
            echo "ERROR: dandelion DTB not found"
            exit 1
          fi

          cp "$DTB" dandelion.dtb

          echo "Dandelion DTB:"
          ls -lh dandelion.dtb
          file dandelion.dtb

      - name: Extract stock wrapped DTB
        run: |
          python3 <<'PY'
          import struct

          boot = open("stock-boot.img", "rb").read()

          magic = b"\xd7\xb7\xab\x1e"
          pos = boot.find(magic)

          if pos < 0:
              raise SystemExit("Vendor DT header not found")

          print(f"Vendor DT header: 0x{pos:X}")

          # MediaTek/vendor header:
          # +0x00 magic
          # +0x04 total container size
          # +0x08 header size
          # +0x0C payload offset
          # +0x20 payload size
          # +0x24 payload alignment

          total_size = struct.unpack_from(">I", boot, pos + 4)[0]
          header_size = struct.unpack_from(">I", boot, pos + 8)[0]
          payload_offset = struct.unpack_from(">I", boot, pos + 12)[0]
          payload_size = struct.unpack_from(">I", boot, pos + 0x20)[0]

          print(f"Total size:    {total_size}")
          print(f"Header size:   {header_size}")
          print(f"Payload offset:{payload_offset}")
          print(f"Payload size:  {payload_size}")

          dtb_start = pos + payload_offset
          dtb_end = dtb_start + payload_size

          if dtb_end > len(boot):
              raise SystemExit("DTB extends outside boot image")

          dtb = boot[dtb_start:dtb_end]

          if dtb[:4] != b"\xd0\x0d\xfe\xed":
              raise SystemExit(
                  "Extracted payload is not a standard FDT"
              )

          open("stock-dandelion.dtb", "wb").write(dtb)

          print(
              f"Extracted stock DTB: "
              f"0x{dtb_start:X}-0x{dtb_end:X}"
          )
          PY

          ls -lh stock-dandelion.dtb

      - name: Convert both DTBs to DTS
        run: |
          dtc -I dtb -O dts \
            stock-dandelion.dtb \
            -o stock-dandelion.dts \
            2> stock-dtc-warnings.txt || true

          dtc -I dtb -O dts \
            dandelion.dtb \
            -o dandelion.dts \
            2> dandelion-dtc-warnings.txt || true

      - name: Generate DTB header information
        run: |
          python3 <<'PY'
          import struct

          def info(path):
              data=open(path,"rb").read()

              vals=struct.unpack(">10I",data[:40])

              return {
                  "file": path,
                  "size": len(data),
                  "magic": hex(vals[0]),
                  "totalsize": vals[1],
                  "off_dt_struct": hex(vals[2]),
                  "off_dt_strings": hex(vals[3]),
                  "off_mem_rsvmap": hex(vals[4]),
                  "version": vals[5],
                  "last_comp_version": vals[6],
                  "boot_cpuid_phys": vals[7],
                  "size_dt_strings": vals[8],
                  "size_dt_struct": vals[9],
              }

          with open("dtb-header-comparison.txt","w") as f:
              for path in ["stock-dandelion.dtb","dandelion.dtb"]:
                  f.write("="*70+"\n")
                  for k,v in info(path).items():
                      f.write(f"{k}: {v}\n")
                  f.write("\n")
          PY

          cat dtb-header-comparison.txt

      - name: Extract important DT properties
        run: |
          python3 <<'PY'
          import re

          files = {
              "STOCK": "stock-dandelion.dts",
              "MAINLINE": "dandelion.dts"
          }

          patterns = [
              r'model\s*=\s*"[^"]*"',
              r'compatible\s*=\s*[^;]+;',
              r'bootargs\s*=\s*"[^"]*"',
              r'linux,initrd-start[^;]*;',
              r'linux,initrd-end[^;]*;',
              r'memory@[^ ]*',
              r'ramoops@[^ ]*',
              r'chosen\s*\{',
              r'cpus\s*\{',
              r'cpu@[^ ]*',
              r'firmware-name\s*=\s*"[^"]*"',
          ]

          with open("important-dt-properties.txt","w") as out:

              for name,path in files.items():

                  out.write("\n")
                  out.write("#"*70+"\n")
                  out.write(name+"\n")
                  out.write("#"*70+"\n")

                  text=open(path,errors="replace").read()

                  for pattern in patterns:

                      out.write(f"\nPATTERN: {pattern}\n")

                      matches=re.findall(pattern,text)

                      for m in matches[:100]:
                          out.write(str(m)+"\n")
          PY

          cat important-dt-properties.txt

      - name: Compare DT node names
        run: |
          python3 <<'PY'
          import re

          def nodes(path):
              text=open(path,errors="replace").read()

              result=set()

              for line in text.splitlines():
                  line=line.strip()

                  if line.endswith("{"):
                      name=line[:-1].strip()

                      if name and not name.startswith(("/","//")):
                          result.add(name)

              return result

          stock=nodes("stock-dandelion.dts")
          mainline=nodes("dandelion.dts")

          only_stock=sorted(stock-mainline)
          only_mainline=sorted(mainline-stock)
          common=sorted(stock&mainline)

          with open("dt-node-comparison.txt","w") as f:

              f.write("STOCK ONLY\n")
              f.write("="*70+"\n")

              for x in only_stock:
                  f.write(x+"\n")

              f.write("\nMAINLINE ONLY\n")
              f.write("="*70+"\n")

              for x in only_mainline:
                  f.write(x+"\n")

              f.write("\nCOMMON\n")
              f.write("="*70+"\n")

              for x in common:
                  f.write(x+"\n")

              f.write("\nSUMMARY\n")
              f.write("="*70+"\n")
              f.write(f"Stock nodes: {len(stock)}\n")
              f.write(f"Mainline nodes: {len(mainline)}\n")
              f.write(f"Common nodes: {len(common)}\n")
              f.write(f"Stock only: {len(only_stock)}\n")
              f.write(f"Mainline only: {len(only_mainline)}\n")
          PY

          cat dt-node-comparison.txt

      - name: Search Redmi 9A identity
        run: |
          {
            echo "STOCK:"
            grep -inE \
              'dandelion|mt6762|mt6765|xiaomi' \
              stock-dandelion.dts | head -100 || true

            echo
            echo "MAINLINE:"
            grep -inE \
              'dandelion|mt6762|mt6765|xiaomi' \
              dandelion.dts | head -100 || true
          } > device-identity.txt

          cat device-identity.txt

      - name: SHA256
        run: |
          sha256sum \
            stock-boot.img \
            stock-dandelion.dtb \
            dandelion.dtb \
            > SHA256SUMS.txt

      - name: Package final report
        run: |
          mkdir -p Redmi9A-DTB-Deep-Compare

          cp stock-dandelion.dtb \
            Redmi9A-DTB-Deep-Compare/

          cp dandelion.dtb \
            Redmi9A-DTB-Deep-Compare/

          cp stock-dandelion.dts \
            Redmi9A-DTB-Deep-Compare/

          cp dandelion.dts \
            Redmi9A-DTB-Deep-Compare/

          cp stock-dtc-warnings.txt \
            Redmi9A-DTB-Deep-Compare/

          cp dandelion-dtc-warnings.txt \
            Redmi9A-DTB-Deep-Compare/

          cp dtb-header-comparison.txt \
            Redmi9A-DTB-Deep-Compare/

          cp important-dt-properties.txt \
            Redmi9A-DTB-Deep-Compare/

          cp dt-node-comparison.txt \
            Redmi9A-DTB-Deep-Compare/

          cp device-identity.txt \
            Redmi9A-DTB-Deep-Compare/

          cp SHA256SUMS.txt \
            Redmi9A-DTB-Deep-Compare/

          zip -r \
            Redmi9A-DTB-Deep-Compare.zip \
            Redmi9A-DTB-Deep-Compare

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-DTB-Deep-Compare
          path: Redmi9A-DTB-Deep-Compare.zip
          retention-days: 14
