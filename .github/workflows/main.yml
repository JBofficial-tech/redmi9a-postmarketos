name: Inspect Redmi 9A Stock Boot

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Download stock boot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "33605127291"
          ARTIFACT_NAME: "Redmi9A-Stock-Boot-V12.5.9.0-RCDINXM"
        run: |
          mkdir -p work

          echo "Finding artifact..."

          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | .id" \
            | head -n 1)

          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: Artifact not found!"
            exit 1
          fi

          echo "Artifact ID: $ARTIFACT_ID"

          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > work/stock-artifact.zip

          echo "Artifact downloaded:"
          ls -lh work/stock-artifact.zip

      - name: Extract boot.img
        run: |
          mkdir -p work/boot

          unzip -o work/stock-artifact.zip -d work/boot

          echo "Contents:"
          find work/boot -type f -exec ls -lh {} \;

          BOOT=$(find work/boot -name "stock-boot.img" -type f | head -n 1)

          if [ -z "$BOOT" ]; then
            echo "ERROR: stock-boot.img not found!"
            exit 1
          fi

          cp "$BOOT" work/stock-boot.img

          echo "Stock boot image:"
          ls -lh work/stock-boot.img

      - name: Verify stock boot
        run: |
          echo "========== FILE =========="
          file work/stock-boot.img

          echo
          echo "========== SIZE =========="
          stat -c "Size: %s bytes" work/stock-boot.img

          echo
          echo "========== SHA256 =========="
          sha256sum work/stock-boot.img

          echo
          echo "========== MD5 =========="
          md5sum work/stock-boot.img

          echo
          echo "========== BOOT MAGIC =========="
          xxd -l 16 work/stock-boot.img

      - name: Parse Android boot header
        run: |
          python3 <<'PY'
          import struct

          path = "work/stock-boot.img"

          with open(path, "rb") as f:
              data = f.read(4096)

          print("========== ANDROID BOOT HEADER ==========")

          magic = data[0:8]
          print("Magic:", magic)

          if magic != b"ANDROID!":
              print("ERROR: Not a standard Android boot image!")
              raise SystemExit(1)

          kernel_size = struct.unpack_from("<I", data, 8)[0]
          kernel_addr = struct.unpack_from("<I", data, 12)[0]

          ramdisk_size = struct.unpack_from("<I", data, 16)[0]
          ramdisk_addr = struct.unpack_from("<I", data, 20)[0]

          second_size = struct.unpack_from("<I", data, 24)[0]
          second_addr = struct.unpack_from("<I", data, 28)[0]

          tags_addr = struct.unpack_from("<I", data, 32)[0]
          page_size = struct.unpack_from("<I", data, 36)[0]

          dt_size = struct.unpack_from("<I", data, 40)[0]
          dt_addr = struct.unpack_from("<I", data, 44)[0]

          name = data[48:64].split(b"\0", 1)[0].decode(
              "ascii", errors="replace"
          )

          cmdline = data[64:576].split(b"\0", 1)[0].decode(
              "ascii", errors="replace"
          )

          print("Kernel size :", kernel_size)
          print("Kernel addr :", hex(kernel_addr))
          print("Ramdisk size:", ramdisk_size)
          print("Ramdisk addr:", hex(ramdisk_addr))
          print("Second size :", second_size)
          print("Second addr :", hex(second_addr))
          print("Tags addr   :", hex(tags_addr))
          print("Page size   :", page_size)
          print("DT size     :", dt_size)
          print("DT addr     :", hex(dt_addr))
          print("Board name  :", name)

          print()
          print("========== CMDLINE ==========")
          print(cmdline)

          print()
          print("========== POSSIBLE HEADER VERSION ==========")

          # Android boot v0/v1/v2-v3 identification heuristics
          if len(data) >= 1632:
              print("Header area available for extended inspection.")

          PY

      - name: Inspect image structure
        run: |
          echo "========== BOOT IMAGE STRINGS =========="
          strings -n 8 work/stock-boot.img | head -n 100 || true

          echo
          echo "========== IMAGE SIGNATURES =========="
          grep -aob "ANDROID!" work/stock-boot.img || true
          grep -aob "DHTB" work/stock-boot.img || true

      - name: Upload inspected boot
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-Stock-Boot-Inspected
          path: |
            work/stock-boot.img
          retention-days: 7
