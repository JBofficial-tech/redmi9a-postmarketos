name: Redmi 9A - Stock Boot Inspector

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            curl \
            python3 \
            unzip \
            tar \
            gzip \
            file \
            binwalk \
            xz-utils

      - name: Download Redmi 9A Global Fastboot ROM
        run: |
          wget -O rom.tgz \
            "https://bigota.d.miui.com/V12.5.7.0.RCDMIXM/dandelion_global_images_V12.5.7.0.RCDMIXM_20221107.0000.00_11.0_global_3319fae180.tgz"

      - name: Check ROM
        run: |
          ls -lh rom.tgz
          file rom.tgz

      - name: Extract ROM
        run: |
          mkdir rom
          tar -xzf rom.tgz -C rom

      - name: Find boot image
        run: |
          echo "Searching boot.img..."
          find rom -type f -name "boot.img" -print

      - name: Inspect boot image
        run: |
          BOOT=$(find rom -type f -name "boot.img" | head -1)

          if [ -z "$BOOT" ]; then
            echo "ERROR: boot.img not found"
            exit 1
          fi

          mkdir -p inspection

          cp "$BOOT" inspection/stock-boot.img

          echo "=== FILE ==="
          file "$BOOT" | tee inspection/file.txt

          echo
          echo "=== SIZE ==="
          stat -c '%n %s bytes' "$BOOT" | tee inspection/size.txt

          echo
          echo "=== STRINGS / HEADER INFO ==="
          strings "$BOOT" | head -100 | tee inspection/strings.txt

          echo
          echo "=== BINWALK ==="
          binwalk "$BOOT" | tee inspection/binwalk.txt

      - name: Upload stock boot
        uses: actions/upload-artifact@v4
        with:
          name: redmi9a-stock-boot-inspection
          path: inspection/
