name: Redmi 9A Dandelion Compatibility Check

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compatibility:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. Install tools
      # =========================================================
      - name: Install analysis tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            python3 \
            unzip \
            git \
            file \
            binwalk \
            device-tree-compiler \
            gzip \
            cpio

      # =========================================================
      # 2. Get all Actions artifacts
      # =========================================================
      - name: Get artifact list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            > artifacts.json

          echo "=============================================="
          echo "AVAILABLE ARTIFACTS"
          echo "=============================================="

          python3 - <<'PY'
          import json

          data = json.load(open("artifacts.json"))

          for a in data.get("artifacts", []):
              if not a["expired"]:
                  print(
                      f'ID={a["id"]} | '
                      f'NAME={a["name"]} | '
                      f'CREATED={a["created_at"]}'
                  )
          PY

      # =========================================================
      # 3. Download stock boot artifact
      # =========================================================
      - name: Download stock boot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p stock

          STOCK_ID=$(python3 - <<'PY'
          import json

          data = json.load(open("artifacts.json"))

          candidates = []

          for a in data.get("artifacts", []):
              if a["expired"]:
                  continue

              if "stock-boot" in a["name"].lower():
                  candidates.append(a)

          candidates.sort(
              key=lambda x: x["created_at"],
              reverse=True
          )

          if not candidates:
              raise SystemExit(
                  "ERROR: Stock boot artifact not found"
              )

          print(candidates[0]["id"])
          PY
          )

          echo "Stock artifact ID: $STOCK_ID"

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/artifacts/${STOCK_ID}/zip" \
            > stock/stock.zip

          unzip -oq stock/stock.zip \
            -d stock/extracted

          STOCK=$(find stock/extracted \
            -type f \
            -name "stock-boot.img" \
            | head -n1)

          if [ -z "$STOCK" ]; then
            echo "ERROR: stock-boot.img not found"
            exit 1
          fi

          cp "$STOCK" stock-boot.img

          echo
          echo "Stock boot:"
          file stock-boot.img
          ls -lh stock-boot.img

      # =========================================================
      # 4. Download kernel/DTB artifact
      # =========================================================
      - name: Download kernel and DTB artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf kernel-artifact
          mkdir -p kernel-artifact/candidates

          python3 - <<'PY'
          import json

          data = json.load(open("artifacts.json"))

          candidates = []

          for a in data.get("artifacts", []):
              if a["expired"]:
                  continue

              name = a["name"].lower()

              if "stock-boot" in name:
                  continue

              if (
                  "kernel" in name
                  or "dandelion" in name
                  or "pmos" in name
              ):
                  candidates.append(a)

          candidates.sort(
              key=lambda x: x["created_at"],
              reverse=True
          )

          with open("kernel_candidates.txt", "w") as f:
              for a in candidates:
                  f.write(str(a["id"]) + "\n")

          print("Kernel candidates:")
          for a in candidates:
              print(a["id"], a["name"])
          PY

          FOUND=""

          while read -r ID; do

            echo
            echo "=============================================="
            echo "CHECKING ARTIFACT $ID"
            echo "=============================================="

            rm -rf kernel-artifact/current
            mkdir -p kernel-artifact/current

            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/artifacts/${ID}/zip" \
              > kernel-artifact/current.zip

            unzip -oq \
              kernel-artifact/current.zip \
              -d kernel-artifact/current || true

            find kernel-artifact/current \
              -type f \
              -printf '%p\n'

            IMAGE=$(find kernel-artifact/current \
              -type f \
              \( \
                -name "Image" \
                -o -name "Image.gz" \
              \) \
              | head -n1)

            DTB=$(find kernel-artifact/current \
              -type f \
              \( \
                -name "dandelion.dtb" \
                -o -name "mt6762g-xiaomi-dandelion.dtb" \
              \) \
              | head -n1)

            if [ -n "$IMAGE" ] && [ -n "$DTB" ]; then

              echo
              echo "CORRECT ARTIFACT FOUND"
              echo "Artifact ID: $ID"
              echo "Kernel: $IMAGE"
              echo "DTB: $DTB"

              mkdir -p kernel-artifact/final

              cp "$IMAGE" kernel-artifact/final/Image
              cp "$DTB" kernel-artifact/final/dandelion.dtb

              FOUND="yes"
              break
            fi

          done < kernel_candidates.txt

          if [ -z "$FOUND" ]; then
            echo "ERROR: Kernel + DTB artifact not found"
            exit 1
          fi

      # =========================================================
      # 5. Extract stock boot DTB
      # =========================================================
      - name: Extract stock boot components
        run: |
          set -e

          rm -rf stock-unpacked
          mkdir -p stock-unpacked

          git clone --depth=1 \
            https://android.googlesource.com/platform/system/tools/mkbootimg \
            tools-mkbootimg

          python3 tools-mkbootimg/unpack_bootimg.py \
            --boot_img stock-boot.img \
            --out stock-unpacked

          echo
          echo "=============================================="
          echo "STOCK BOOT CONTENTS"
          echo "=============================================="

          find stock-unpacked \
            -type f \
            -exec ls -lh {} \;

      # =========================================================
      # 6. Locate stock DTB
      # =========================================================
      - name: Locate stock DTB
        run: |
          set -e

          echo "=============================================="
          echo "SEARCHING STOCK DTB"
          echo "=============================================="

          find stock-unpacked \
            -type f \
            -print

          STOCK_DTB=$(find stock-unpacked \
            -type f \
            \( \
              -name "*.dtb" \
              -o -name "dtb" \
              -o -name "dt.img" \
            \) \
            | head -n1)

          if [ -z "$STOCK_DTB" ]; then
            echo
            echo "WARNING: unpack_boot_img did not expose DTB."
            echo "Searching boot image with binwalk..."

            binwalk stock-boot.img || true

            exit 0
          fi

          cp "$STOCK_DTB" stock.dtb

          echo
          echo "Stock DTB:"
          file stock.dtb
          ls -lh stock.dtb

      # =========================================================
      # 7. Decompile both DTBs
      # =========================================================
      - name: Decompile device trees
        run: |
          set -e

          if [ ! -f stock.dtb ]; then
            echo "Stock DTB unavailable; skipping DTB comparison."
            exit 0
          fi

          mkdir -p dts

          echo "Decompiling STOCK DTB..."

          dtc \
            -I dtb \
            -O dts \
            -o dts/stock.dts \
            stock.dtb \
            2> dts/stock-dtc-errors.txt || true

          echo "Decompiling NEW Redmi 9A DTB..."

          dtc \
            -I dtb \
            -O dts \
            -o dts/dandelion.dts \
            kernel-artifact/final/dandelion.dtb \
            2> dts/dandelion-dtc-errors.txt || true

          echo
          echo "=============================================="
          echo "DTS FILES"
          echo "=============================================="

          ls -lh dts/

      # =========================================================
      # 8. Check important hardware nodes
      # =========================================================
      - name: Compare important hardware nodes
        run: |
          set -e

          mkdir -p report

          {
            echo "=============================================="
            echo "REDMI 9A DEVICE TREE COMPATIBILITY REPORT"
            echo "=============================================="
            echo

            echo "DATE:"
            date
            echo

            echo "=============================================="
            echo "NEW DTB INFORMATION"
            echo "=============================================="

            file kernel-artifact/final/dandelion.dtb
            ls -lh kernel-artifact/final/dandelion.dtb

            echo

            echo "=============================================="
            echo "STOCK DTB INFORMATION"
            echo "=============================================="

            if [ -f stock.dtb ]; then
              file stock.dtb
              ls -lh stock.dtb
            else
              echo "Stock DTB unavailable"
            fi

            echo

            echo "=============================================="
            echo "IMPORTANT NODE SEARCH"
            echo "=============================================="

            for pattern in \
              "compatible" \
              "chosen" \
              "memory" \
              "uart" \
              "serial" \
              "mmc" \
              "sdhci" \
              "emmc" \
              "gpio" \
              "regulator" \
              "clk" \
              "clock" \
              "watchdog" \
              "usb" \
              "mt6762" \
              "mt6765" \
              "dandelion"
            do

              echo
              echo "----- $pattern -----"

              if [ -f dts/stock.dts ]; then
                echo "[STOCK]"
                grep -in "$pattern" dts/stock.dts \
                  | head -40 || true
              fi

              if [ -f dts/dandelion.dts ]; then
                echo "[NEW]"
                grep -in "$pattern" dts/dandelion.dts \
                  | head -40 || true
              fi

            done

          } | tee report/compatibility.txt

      # =========================================================
      # 9. Kernel information
      # =========================================================
      - name: Inspect kernel
        run: |
          set -e

          {
            echo "=============================================="
            echo "KERNEL INFORMATION"
            echo "=============================================="

            file kernel-artifact/final/Image

            ls -lh kernel-artifact/final/Image

            echo
            echo "SHA256:"
            sha256sum kernel-artifact/final/Image

            echo
            echo "DTB SHA256:"
            sha256sum kernel-artifact/final/dandelion.dtb

            echo
            echo "=============================================="
            echo "KERNEL STRINGS"
            echo "=============================================="

            strings kernel-artifact/final/Image \
              | grep -Ei \
              "Linux version|mt6762|mt6765|dandelion|android" \
              | head -50 || true

          } | tee report/kernel.txt

      # =========================================================
      # 10. Stock boot information
      # =========================================================
      - name: Inspect stock boot header
        run: |
          set -e

          {
            echo "=============================================="
            echo "STOCK BOOT IMAGE"
            echo "=============================================="

            file stock-boot.img

            ls -lh stock-boot.img

            echo
            echo "SHA256:"
            sha256sum stock-boot.img

            echo
            echo "=============================================="
            echo "BINWALK"
            echo "=============================================="

            binwalk stock-boot.img || true

            echo
            echo "=============================================="
            echo "BOOT CONFIG"
            echo "=============================================="

            if [ -f stock-unpacked/bootimg.cfg ]; then
              cat stock-unpacked/bootimg.cfg
            else
              echo "No bootimg.cfg"
            fi

          } | tee report/stock-boot.txt

      # =========================================================
      # 11. Final safety confirmation
      # =========================================================
      - name: Safety confirmation
        run: |
          set -e

          echo
          echo "=============================================="
          echo "SAFETY CONFIRMATION"
          echo "=============================================="
          echo
          echo "NO DEVICE WAS FLASHED."
          echo
          echo "NO FASTBOOT COMMAND WAS USED."
          echo
          echo "NO PRELOADER WAS MODIFIED."
          echo
          echo "NO PARTITION WAS WRITTEN."
          echo
          echo "This workflow only analyzes kernel,"
          echo "DTB and stock boot compatibility."
          echo

      # =========================================================
      # 12. Upload complete report
      # =========================================================
      - name: Upload compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-Dandelion-Compatibility-Report
          path: |
            report/
            dts/
            kernel-artifact/final/
            stock.dtb
            stock-unpacked/
            stock-boot.img
          if-no-files-found: warn
