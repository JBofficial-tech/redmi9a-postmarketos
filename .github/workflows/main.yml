name: Build Redmi 9A pmOS Test Boot

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Install required tools
      # ---------------------------------------------------------
      - name: Install tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            unzip \
            gzip \
            file \
            binwalk \
            python3 \
            cpio

      # ---------------------------------------------------------
      # 3. Download STOCK Redmi 9A boot artifact
      # ---------------------------------------------------------
      - name: Download stock boot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p stock

          echo "=========================================="
          echo "Downloading verified stock boot artifact"
          echo "=========================================="

          gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/9842100784/zip \
            > stock/artifact.zip

          unzip -o stock/artifact.zip -d stock

          echo
          echo "Stock files:"
          find stock -maxdepth 3 -type f -print

          STOCK=$(find stock -type f -name "stock-boot.img" | head -n1)

          if [ -z "$STOCK" ]; then
            echo "ERROR: stock-boot.img not found"
            exit 1
          fi

          cp "$STOCK" stock-boot.img

          echo
          echo "Stock boot image:"
          ls -lh stock-boot.img
          file stock-boot.img

      # ---------------------------------------------------------
      # 4. Prepare Redmi 9A kernel source
      # ---------------------------------------------------------
      - name: Prepare kernel source
        run: |
          set -e

          echo "=========================================="
          echo "Preparing Redmi 9A kernel source"
          echo "=========================================="

          rm -rf kernel

          git clone --depth=1 \
            --branch mt6765 \
            https://github.com/dandelion64-Archives/linux-mt6762-garden.git \
            kernel

          echo
          echo "Kernel source prepared."

          test -f kernel/Makefile
          test -d kernel/arch/arm64

      # ---------------------------------------------------------
      # 5. Build Redmi 9A kernel + DTB
      # ---------------------------------------------------------
      - name: Build Redmi 9A kernel and DTB
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64

          echo "=========================================="
          echo "Building Redmi 9A kernel"
          echo "=========================================="

          rm -rf out

          mkdir -p out

          echo
          echo "Using mt6765_defconfig..."

          make O=out mt6765_defconfig

          echo
          echo "=========================================="
          echo "Building kernel Image"
          echo "=========================================="

          make -j"$(nproc)" O=out Image

          echo
          echo "=========================================="
          echo "Building Redmi 9A DTB"
          echo "=========================================="

          make -j"$(nproc)" O=out \
            mediatek/mt6762g-xiaomi-dandelion.dtb

          echo
          echo "=========================================="
          echo "BUILD OUTPUT"
          echo "=========================================="

          test -f out/arch/arm64/boot/Image
          test -f out/arch/arm64/boot/dts/mediatek/mt6762g-xiaomi-dandelion.dtb

          echo
          echo "--- Kernel Image ---"
          ls -lh out/arch/arm64/boot/Image

          echo
          echo "--- Redmi 9A DTB ---"
          ls -lh out/arch/arm64/boot/dts/mediatek/mt6762g-xiaomi-dandelion.dtb

          echo
          echo "Kernel + DTB build completed successfully."

      # ---------------------------------------------------------
      # 6. Prepare components
      # ---------------------------------------------------------
      - name: Prepare components
        run: |
          set -e

          echo "=========================================="
          echo "Preparing build components"
          echo "=========================================="

          rm -rf work
          mkdir -p work

          cp \
            kernel/out/arch/arm64/boot/Image \
            work/Image

          cp \
            kernel/out/arch/arm64/boot/dts/mediatek/mt6762g-xiaomi-dandelion.dtb \
            work/dandelion.dtb

          echo
          echo "Components:"

          ls -lh work/

          echo
          file work/Image
          file work/dandelion.dtb

      # ---------------------------------------------------------
      # 7. Get Android boot image tools
      # ---------------------------------------------------------
      - name: Get Android boot image tools
        run: |
          set -e

          echo "=========================================="
          echo "Getting Android boot image tools"
          echo "=========================================="

          rm -rf tools
          mkdir -p tools

          git clone --depth=1 \
            https://android.googlesource.com/platform/system/tools/mkbootimg \
            tools/mkbootimg

          test -f tools/mkbootimg/mkbootimg.py
          test -f tools/mkbootimg/unpack_bootimg.py

          echo
          echo "Android boot image tools ready."

      # ---------------------------------------------------------
      # 8. Unpack stock boot image
      # ---------------------------------------------------------
      - name: Unpack stock boot
        run: |
          set -e

          echo "=========================================="
          echo "Unpacking stock Redmi 9A boot image"
          echo "=========================================="

          rm -rf stock-unpacked
          mkdir -p stock-unpacked

          python3 tools/mkbootimg/unpack_bootimg.py \
            --boot_img stock-boot.img \
            --out stock-unpacked

          echo
          echo "=== STOCK BOOT CONTENTS ==="

          find stock-unpacked \
            -maxdepth 2 \
            -type f \
            -exec ls -lh {} \;

          echo
          echo "=== STOCK HEADER ==="

          if [ -f stock-unpacked/bootimg.cfg ]; then
            cat stock-unpacked/bootimg.cfg
          else
            echo "bootimg.cfg not generated by this mkbootimg version."
          fi

      # ---------------------------------------------------------
      # 9. Verify stock structure
      # ---------------------------------------------------------
      - name: Verify stock structure
        run: |
          set -e

          echo "=========================================="
          echo "STOCK BOOT VERIFICATION"
          echo "=========================================="

          echo
          echo "--- BOOT IMAGE ---"
          ls -lh stock-boot.img
          file stock-boot.img

          echo
          echo "--- UNPACKED FILES ---"

          find stock-unpacked \
            -type f \
            -printf '%p %s bytes\n'

          echo
          echo "--- BINWALK ---"

          binwalk stock-boot.img || true

          echo
          echo "--- KERNEL ---"

          file stock-unpacked/kernel || true

          echo
          echo "--- RAMDISK ---"

          file stock-unpacked/ramdisk || true

          echo
          echo "--- DTB ---"

          file stock-unpacked/*.dtb 2>/dev/null || true

      # ---------------------------------------------------------
      # 10. Safety check
      # ---------------------------------------------------------
      - name: Safety check
        run: |
          set -e

          echo "=========================================="
          echo "SAFETY CHECK"
          echo "=========================================="

          echo
          echo "This workflow DOES NOT flash the device."

          echo
          echo "--- STOCK BOOT SHA256 ---"
          sha256sum stock-boot.img

          echo
          echo "--- NEW KERNEL SHA256 ---"
          sha256sum work/Image

          echo
          echo "--- REDMI 9A DTB SHA256 ---"
          sha256sum work/dandelion.dtb

          echo
          echo "No fastboot commands are executed."
          echo "No device is modified."

      # ---------------------------------------------------------
      # 11. Upload build components
      # ---------------------------------------------------------
      - name: Upload packaging files
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-pmOS-Test-Components
          path: |
            stock-boot.img
            work/Image
            work/dandelion.dtb
            stock-unpacked/
          if-no-files-found: error
