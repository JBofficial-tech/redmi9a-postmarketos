name: Download Redmi 9A Stock Boot

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare
        run: |
          mkdir -p work/chunks work/out

      - name: Parallel download stock ROM
        env:
          ROM_URL: https://bigota.d.miui.com/V12.5.9.0.RCDINXM/dandelion_in_global_images_V12.5.9.0.RCDINXM_20220915.0000.00_11.0_in_921f22da4d.tgz
          ROM_SIZE: 2957502060
          CHUNKS: 32
        run: |
          python3 <<'PY'
          import os
          import urllib.request
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed

          URL = os.environ["ROM_URL"]
          SIZE = int(os.environ["ROM_SIZE"])
          N = int(os.environ["CHUNKS"])

          chunk_dir = "work/chunks"
          os.makedirs(chunk_dir, exist_ok=True)

          chunk_size = (SIZE + N - 1) // N

          def download_chunk(i):
              start = i * chunk_size
              end = min(SIZE - 1, start + chunk_size - 1)
              expected = end - start + 1
              path = f"{chunk_dir}/chunk_{i:03d}"

              for attempt in range(1, 7):
                  try:
                      if os.path.exists(path):
                          if os.path.getsize(path) == expected:
                              print(f"[{i+1}/{N}] already complete")
                              return True
                          os.remove(path)

                      print(f"[{i+1}/{N}] bytes {start}-{end} (attempt {attempt})")

                      req = urllib.request.Request(
                          URL,
                          headers={
                              "Range": f"bytes={start}-{end}",
                              "User-Agent": "Mozilla/5.0"
                          }
                      )

                      with urllib.request.urlopen(req, timeout=120) as r:
                          if r.status != 206:
                              raise RuntimeError(
                                  f"Server returned HTTP {r.status}, expected 206"
                              )

                          with open(path, "wb") as f:
                              while True:
                                  data = r.read(1024 * 1024)
                                  if not data:
                                      break
                                  f.write(data)

                      actual = os.path.getsize(path)

                      if actual != expected:
                          raise RuntimeError(
                              f"Size mismatch: got {actual}, expected {expected}"
                          )

                      print(f"[{i+1}/{N}] OK")
                      return True

                  except Exception as e:
                      print(f"[{i+1}/{N}] FAILED: {e}")
                      if os.path.exists(path):
                          os.remove(path)
                      time.sleep(3 * attempt)

              return False

          with ThreadPoolExecutor(max_workers=16) as executor:
              futures = [
                  executor.submit(download_chunk, i)
                  for i in range(N)
              ]

              results = [f.result() for f in as_completed(futures)]

          if not all(results):
              raise SystemExit("One or more chunks failed.")

          print("All chunks downloaded successfully.")
          PY

      - name: Join chunks
        run: |
          cat work/chunks/chunk_* > work/out/rom.tgz

          ACTUAL=$(stat -c%s work/out/rom.tgz)
          EXPECTED=2957502060

          echo "ROM size: $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Final ROM size mismatch!"
            exit 1
          fi

          echo "Final ROM size OK."

      - name: Verify MD5
        run: |
          echo "Expected:"
          echo "921f22da4d242430f4ae54999da07b23"

          echo "Actual:"
          md5sum work/out/rom.tgz

          ACTUAL=$(md5sum work/out/rom.tgz | awk '{print $1}')
          EXPECTED=921f22da4d242430f4ae54999da07b23

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: MD5 mismatch!"
            exit 1
          fi

          echo "MD5 VERIFIED."

      - name: Find boot.img
        run: |
          echo "Searching for boot.img..."

          tar -tzf work/out/rom.tgz | grep -E '(^|/)boot\.img$' || true

          BOOT_PATH=$(tar -tzf work/out/rom.tgz | grep -E '(^|/)boot\.img$' | head -n 1)

          if [ -z "$BOOT_PATH" ]; then
            echo "ERROR: boot.img not found!"
            exit 1
          fi

          echo "Found: $BOOT_PATH"

          tar -xzf work/out/rom.tgz \
            -C work \
            "$BOOT_PATH"

          mkdir -p work/boot

          cp "work/$BOOT_PATH" work/boot/stock-boot.img

          echo "Boot image:"
          ls -lh work/boot/stock-boot.img

      - name: Inspect stock boot.img
        run: |
          file work/boot/stock-boot.img
          ls -lh work/boot/stock-boot.img

          echo "First 64 bytes:"
          xxd -l 64 work/boot/stock-boot.img

      - name: Upload stock boot.img
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-Stock-Boot-V12.5.9.0-RCDINXM
          path: work/boot/stock-boot.img
          retention-days: 7
