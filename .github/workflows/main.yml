name: Redmi 9A DT Deep Analysis

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            device-tree-compiler \
            python3 \
            file \
            binutils \
            xxd

      # ==================================================
      # DOWNLOAD STOCK DT EXTRACTION
      # ==================================================

      - name: Download stock DT extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stock

          gh run download 33856392991 \
            -n Redmi9A-Stock-DT-Extracted \
            -D stock

          echo "=== STOCK ARTIFACT FILES ==="
          find stock -type f -print

      - name: Locate stock DTS
        run: |
          STOCK_DTS=$(find stock \
            -type f \
            -name "stock-dandelion.dts" \
            | head -n 1)

          if [ -z "$STOCK_DTS" ]; then
            echo "ERROR: stock-dandelion.dts not found"
            exit 1
          fi

          cp "$STOCK_DTS" stock.dts

          echo "=== STOCK DTS ==="
          ls -lh stock.dts

      - name: Locate stock DTB
        run: |
          STOCK_DTB=$(find stock \
            -type f \
            -name "stock-dandelion.dtb" \
            | head -n 1)

          if [ -z "$STOCK_DTB" ]; then
            STOCK_DTB=$(find stock \
              -type f \
              -name "*.dtb" \
              | head -n 1)
          fi

          if [ -z "$STOCK_DTB" ]; then
            echo "ERROR: stock DTB not found"
            exit 1
          fi

          cp "$STOCK_DTB" stock.dtb

          echo "=== STOCK DTB ==="
          file stock.dtb
          ls -lh stock.dtb

      # ==================================================
      # FIND MAINLINE ARTIFACT AUTOMATICALLY
      # ==================================================

      - name: Find mainline DTB artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== AVAILABLE NON-EXPIRED ARTIFACTS ==="

          gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]
              | select(.expired == false)
              | [.id, .name, .created_at]
              | @tsv' \
            | tee artifacts-list.txt

          echo
          echo "=== SEARCHING FOR MAINLINE ARTIFACT ==="

          ARTIFACT_ID=$(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[]
                | select(.expired == false)
                | select(
                    .name == "Redmi9A-pmOS-Package-Analysis"
                    or
                    (.name | ascii_downcase | contains("dandelion"))
                    or
                    (.name | ascii_downcase | contains("kernel-dtb"))
                  )
                | [.id, .name, .created_at]
                | @tsv' \
              | head -n 1 \
              | cut -f1
          )

          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: Could not find mainline DTB artifact"
            echo
            echo "Available artifacts:"
            cat artifacts-list.txt
            exit 1
          fi

          echo "Selected artifact ID:"
          echo "$ARTIFACT_ID"

          echo "$ARTIFACT_ID" > mainline-artifact-id.txt

      # ==================================================
      # DOWNLOAD MAINLINE ARTIFACT
      # ==================================================

      - name: Download mainline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p mainline

          ARTIFACT_ID=$(cat mainline-artifact-id.txt)

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > mainline-artifact.zip

          unzip -q mainline-artifact.zip \
            -d mainline

          echo "=== MAINLINE ARTIFACT CONTENT ==="
          find mainline -type f -print

      # ==================================================
      # LOCATE MAINLINE DTB
      # ==================================================

      - name: Locate mainline dandelion DTB
        run: |
          echo "=== SEARCHING FOR DTB ==="

          find mainline \
            -type f \
            \( \
              -name "dandelion.dtb" \
              -o \
              -name "mt6762g-xiaomi-dandelion.dtb" \
            \) \
            -print

          MAINLINE_DTB=$(
            find mainline \
              -type f \
              \( \
                -name "dandelion.dtb" \
                -o \
                -name "mt6762g-xiaomi-dandelion.dtb" \
              \) \
              | head -n 1
          )

          if [ -z "$MAINLINE_DTB" ]; then
            echo "ERROR: Mainline dandelion DTB not found"
            echo
            echo "All DTB files found:"
            find mainline -type f -name "*.dtb" -print
            exit 1
          fi

          cp "$MAINLINE_DTB" mainline.dtb

          echo "=== MAINLINE DTB ==="
          file mainline.dtb
          ls -lh mainline.dtb

      # ==================================================
      # DECOMPILE MAINLINE DTB
      # ==================================================

      - name: Decompile mainline DTB
        run: |
          dtc \
            -I dtb \
            -O dts \
            mainline.dtb \
            -o mainline.dts \
            2>&1 | tee mainline-dtc.log || true

          if [ ! -s mainline.dts ]; then
            echo "ERROR: mainline DTS generation failed"
            exit 1
          fi

          echo "Mainline DTS generated successfully"

      # ==================================================
      # DTB HEADER INFORMATION
      # ==================================================

      - name: Inspect DTB headers
        run: |
          python3 <<'PY'
          import struct

          def inspect(path):
              data = open(path, "rb").read()

              print()
              print("=" * 60)
              print(path)
              print("=" * 60)

              if len(data) < 40:
                  print("Too small for FDT header")
                  return

              vals = struct.unpack_from(">10I", data, 0)

              (
                  magic,
                  totalsize,
                  off_struct,
                  off_strings,
                  off_rsvmap,
                  version,
                  last_version,
                  boot_cpu,
                  size_strings,
                  size_struct
              ) = vals

              print(f"Magic            : 0x{magic:08X}")
              print(f"Total size       : {totalsize}")
              print(f"Structure offset : 0x{off_struct:X}")
              print(f"Strings offset   : 0x{off_strings:X}")
              print(f"Reserve map      : 0x{off_rsvmap:X}")
              print(f"Version          : {version}")
              print(f"Last version     : {last_version}")
              print(f"Boot CPU         : {boot_cpu}")
              print(f"Strings size     : {size_strings}")
              print(f"Structure size   : {size_struct}")

          inspect("stock.dtb")
          inspect("mainline.dtb")
          PY

      # ==================================================
      # OVERVIEW
      # ==================================================

      - name: Generate DT overview
        run: |
          {
            echo "=========================================="
            echo "REDMI 9A DEVICE TREE OVERVIEW"
            echo "=========================================="

            echo
            echo "=== STOCK ==="

            grep -inE \
              'model =|compatible =|bootargs|memory@|cpu@|mt6765|dandelion|xiaomi' \
              stock.dts \
              | head -250 || true

            echo
            echo "=== MAINLINE ==="

            grep -inE \
              'model =|compatible =|bootargs|memory@|cpu@|mt6762|mt6765|dandelion|xiaomi' \
              mainline.dts \
              | head -250 || true

          } | tee dt-overview.txt

      # ==================================================
      # NODE EXTRACTION
      # ==================================================

      - name: Extract DT node names
        run: |
          python3 <<'PY'
          import re

          def nodes(path):
              result = set()

              for line in open(path, errors="ignore"):
                  line = line.strip()

                  if not line or line.startswith("//"):
                      continue

                  # Remove labels
                  line = re.sub(
                      r'^[A-Za-z0-9_]+:\s*',
                      '',
                      line
                  )

                  m = re.match(
                      r'([A-Za-z0-9_.,+@\-]+)\s*\{',
                      line
                  )

                  if m:
                      result.add(m.group(1))

              return sorted(result)

          stock = nodes("stock.dts")
          mainline = nodes("mainline.dts")

          open("stock-nodes.txt", "w").write(
              "\n".join(stock) + "\n"
          )

          open("mainline-nodes.txt", "w").write(
              "\n".join(mainline) + "\n"
          )

          print("Stock node count:", len(stock))
          print("Mainline node count:", len(mainline))
          PY

      # ==================================================
      # NODE DIFFERENCES
      # ==================================================

      - name: Compare DT nodes
        run: |
          comm -23 \
            <(sort stock-nodes.txt) \
            <(sort mainline-nodes.txt) \
            > stock-only-nodes.txt || true

          comm -13 \
            <(sort stock-nodes.txt) \
            <(sort mainline-nodes.txt) \
            > mainline-only-nodes.txt || true

          echo "=== STOCK ONLY ==="
          cat stock-only-nodes.txt

          echo
          echo "=== MAINLINE ONLY ==="
          cat mainline-only-nodes.txt

      # ==================================================
      # COMPATIBLE STRINGS
      # ==================================================

      - name: Compare compatible strings
        run: |
          grep -oE \
            'compatible = "[^"]+"' \
            stock.dts \
            | sort -u \
            > stock-compatible.txt

          grep -oE \
            'compatible = "[^"]+"' \
            mainline.dts \
            | sort -u \
            > mainline-compatible.txt

          comm -23 \
            stock-compatible.txt \
            mainline-compatible.txt \
            > stock-only-compatible.txt || true

          comm -13 \
            stock-compatible.txt \
            mainline-compatible.txt \
            > mainline-only-compatible.txt || true

          echo "=== STOCK ONLY COMPATIBLES ==="
          cat stock-only-compatible.txt

          echo
          echo "=== MAINLINE ONLY COMPATIBLES ==="
          cat mainline-only-compatible.txt

      # ==================================================
      # IMPORTANT HARDWARE
      # ==================================================

      - name: Compare important hardware
        run: |
          {
            for pattern in \
              'uart' \
              'serial' \
              'mmc' \
              'msdc' \
              'ufs' \
              'pinctrl' \
              'gpio' \
              'i2c' \
              'spi' \
              'usb' \
              'xhci' \
              'display' \
              'dsi' \
              'drm' \
              'panel' \
              'backlight' \
              'touch' \
              'tpd' \
              'battery' \
              'charger' \
              'pmic' \
              'mt6357' \
              'regulator' \
              'clock' \
              'clk' \
              'watchdog' \
              'wdt' \
              'thermal' \
              'mali' \
              'gpu' \
              'wifi' \
              'wlan' \
              'bluetooth' \
              'camera' \
              'sensor' \
              'reserved-memory' \
              'memory@' \
              'chosen'
            do

              echo
              echo "########################################"
              echo "PATTERN: $pattern"
              echo "########################################"

              echo "--- STOCK ---"
              grep -inE "$pattern" \
                stock.dts \
                | head -100 || true

              echo "--- MAINLINE ---"
              grep -inE "$pattern" \
                mainline.dts \
                | head -100 || true

            done

          } | tee important-hardware.txt

      # ==================================================
      # FULL DIFF
      # ==================================================

      - name: Generate DTS diff
        run: |
          diff -u \
            stock.dts \
            mainline.dts \
            > stock-vs-mainline.diff \
            || true

          echo "DTS diff generated:"
          wc -l stock-vs-mainline.diff

      # ==================================================
      # SUMMARY
      # ==================================================

      - name: Generate summary
        run: |
          {
            echo "=========================================="
            echo "REDMI 9A DT ANALYSIS SUMMARY"
            echo "=========================================="

            echo
            echo "=== FILE SIZES ==="

            ls -lh \
              stock.dtb \
              mainline.dtb \
              stock.dts \
              mainline.dts

            echo
            echo "=== NODE COUNTS ==="

            printf "Stock nodes: "
            wc -l < stock-nodes.txt

            printf "Mainline nodes: "
            wc -l < mainline-nodes.txt

            printf "Stock-only nodes: "
            wc -l < stock-only-nodes.txt

            printf "Mainline-only nodes: "
            wc -l < mainline-only-nodes.txt

            echo
            echo "=== COMPATIBLE COUNTS ==="

            printf "Stock compatibles: "
            wc -l < stock-compatible.txt

            printf "Mainline compatibles: "
            wc -l < mainline-compatible.txt

            printf "Stock-only compatibles: "
            wc -l < stock-only-compatible.txt

            printf "Mainline-only compatibles: "
            wc -l < mainline-only-compatible.txt

          } | tee dt-summary.txt

      # ==================================================
      # PACKAGE EVERYTHING
      # ==================================================

      - name: Create analysis package
        run: |
          mkdir -p Redmi9A-DT-Deep-Analysis

          cp stock.dtb \
            Redmi9A-DT-Deep-Analysis/

          cp mainline.dtb \
            Redmi9A-DT-Deep-Analysis/

          cp stock.dts \
            Redmi9A-DT-Deep-Analysis/

          cp mainline.dts \
            Redmi9A-DT-Deep-Analysis/

          cp mainline-dtc.log \
            Redmi9A-DT-Deep-Analysis/

          cp dt-overview.txt \
            Redmi9A-DT-Deep-Analysis/

          cp stock-nodes.txt \
            Redmi9A-DT-Deep-Analysis/

          cp mainline-nodes.txt \
            Redmi9A-DT-Deep-Analysis/

          cp stock-only-nodes.txt \
            Redmi9A-DT-Deep-Analysis/

          cp mainline-only-nodes.txt \
            Redmi9A-DT-Deep-Analysis/

          cp stock-compatible.txt \
            Redmi9A-DT-Deep-Analysis/

          cp mainline-compatible.txt \
            Redmi9A-DT-Deep-Analysis/

          cp stock-only-compatible.txt \
            Redmi9A-DT-Deep-Analysis/

          cp mainline-only-compatible.txt \
            Redmi9A-DT-Deep-Analysis/

          cp important-hardware.txt \
            Redmi9A-DT-Deep-Analysis/

          cp stock-vs-mainline.diff \
            Redmi9A-DT-Deep-Analysis/

          cp dt-summary.txt \
            Redmi9A-DT-Deep-Analysis/

          cp artifacts-list.txt \
            Redmi9A-DT-Deep-Analysis/

          zip -r \
            Redmi9A-DT-Deep-Analysis.zip \
            Redmi9A-DT-Deep-Analysis

      # ==================================================
      # UPLOAD
      # ==================================================

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-DT-Deep-Analysis
          path: Redmi9A-DT-Deep-Analysis.zip
          retention-days: 14
