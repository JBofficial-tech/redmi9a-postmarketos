name: Deep Inspect Redmi 9A Stock Boot

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. DOWNLOAD STOCK BOOT ARTIFACT
      # =========================================================
      - name: Download stock boot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "33605127291"
          ARTIFACT_NAME: "Redmi9A-Stock-Boot-V12.5.9.0-RCDINXM"

        run: |
          set -e

          mkdir -p work

          echo "Finding stock boot artifact..."

          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | .id" \
            | head -n 1)

          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: Artifact not found!"
            exit 1
          fi

          echo "Artifact ID: $ARTIFACT_ID"

          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > work/artifact.zip

          echo
          echo "Extracting artifact..."

          unzip -o work/artifact.zip -d work/

          if [ ! -f "work/stock-boot.img" ]; then
            echo "ERROR: stock-boot.img not found!"
            exit 1
          fi

          echo
          echo "Stock boot successfully extracted:"
          ls -lh work/stock-boot.img


      # =========================================================
      # 2. INSTALL ANALYSIS TOOLS
      # =========================================================
      - name: Install analysis tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            binwalk \
            cpio \
            gzip \
            xz-utils \
            lz4 \
            zstd \
            file


      # =========================================================
      # 3. BASIC IMAGE INFORMATION
      # =========================================================
      - name: Basic image information
        run: |
          echo "======================================"
          echo " BASIC IMAGE INFORMATION"
          echo "======================================"

          echo
          echo "FILE:"
          file work/stock-boot.img

          echo
          echo "SIZE:"
          stat -c "Size: %s bytes" work/stock-boot.img

          echo
          echo "HUMAN SIZE:"
          ls -lh work/stock-boot.img

          echo
          echo "SHA256:"
          sha256sum work/stock-boot.img

          echo
          echo "MD5:"
          md5sum work/stock-boot.img

          echo
          echo "FIRST 256 BYTES:"
          xxd -l 256 work/stock-boot.img


      # =========================================================
      # 4. PARSE ANDROID BOOT HEADER
      # =========================================================
      - name: Parse Android boot header
        run: |
          python3 <<'PY'
          import struct

          path = "work/stock-boot.img"

          with open(path, "rb") as f:
              data = f.read(4096)

          print("======================================")
          print(" ANDROID BOOT HEADER")
          print("======================================")

          magic = data[0:8]

          print("Magic:", magic)

          if magic != b"ANDROID!":
              raise SystemExit("ERROR: Not an Android boot image!")

          def u32(offset):
              return struct.unpack_from("<I", data, offset)[0]

          kernel_size = u32(8)
          kernel_addr = u32(12)

          ramdisk_size = u32(16)
          ramdisk_addr = u32(20)

          second_size = u32(24)
          second_addr = u32(28)

          tags_addr = u32(32)

          page_size = u32(36)

          dt_size = u32(40)
          dt_addr = u32(44)

          name = data[48:64].split(b"\0", 1)[0]

          cmdline = data[64:576].split(b"\0", 1)[0]

          print()
          print("Kernel size :", kernel_size)
          print("Kernel addr :", hex(kernel_addr))

          print("Ramdisk size:", ramdisk_size)
          print("Ramdisk addr:", hex(ramdisk_addr))

          print("Second size :", second_size)
          print("Second addr :", hex(second_addr))

          print("Tags addr   :", hex(tags_addr))

          print("Page size   :", page_size)

          print("DT size     :", dt_size)
          print("DT addr     :", hex(dt_addr))

          print("Board name  :", repr(name))

          print()
          print("CMDLINE:")
          print(cmdline.decode("ascii", errors="replace"))

          print()
          print("HEADER BYTES 576-2048:")
          print(data[576:2048].hex())

          PY


      # =========================================================
      # 5. CALCULATE COMPONENT OFFSETS
      # =========================================================
      - name: Calculate boot component offsets
        run: |
          python3 <<'PY'
          import struct

          path = "work/stock-boot.img"

          with open(path, "rb") as f:
              h = f.read(4096)

          kernel_size = struct.unpack_from("<I", h, 8)[0]
          ramdisk_size = struct.unpack_from("<I", h, 16)[0]
          second_size = struct.unpack_from("<I", h, 24)[0]
          page_size = struct.unpack_from("<I", h, 36)[0]
          dt_size = struct.unpack_from("<I", h, 40)[0]

          def align(value, alignment):
              return ((value + alignment - 1) // alignment) * alignment

          kernel_offset = page_size

          ramdisk_offset = (
              kernel_offset +
              align(kernel_size, page_size)
          )

          second_offset = (
              ramdisk_offset +
              align(ramdisk_size, page_size)
          )

          dt_offset = (
              second_offset +
              align(second_size, page_size)
          )

          print("======================================")
          print(" CALCULATED COMPONENT OFFSETS")
          print("======================================")

          print()
          print("Page size      :", page_size)

          print()
          print("Header offset  :", hex(0))
          print("Kernel offset  :", hex(kernel_offset))
          print("Ramdisk offset :", hex(ramdisk_offset))
          print("Second offset  :", hex(second_offset))
          print("DT offset      :", hex(dt_offset))

          print()
          print("Kernel size    :", kernel_size)
          print("Ramdisk size   :", ramdisk_size)
          print("Second size    :", second_size)
          print("DT size header :", dt_size)

          print()
