      - name: Build kernel and DTBs
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out ARCH=arm64 defconfig

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image \
            dtbs

      - name: Collect kernel and DTBs
        run: |
          mkdir -p artifacts

          cp kernel/out/arch/arm64/boot/Image artifacts/Image 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image.gz artifacts/Image.gz 2>/dev/null || true

          find kernel/out/arch/arm64/boot/dts \
            -type f \( -name "*.dtb" -o -name "*.dtbo" \) \
            -exec cp --parents {} artifacts/ \; 2>/dev/null || true

          cp kernel/out/.config artifacts/kernel.config 2>/dev/null || true

          echo "=== Kernel ==="
          ls -lh artifacts/Image* 2>/dev/null || true

          echo "=== DTB/DTBO ==="
          find artifacts -type f \( -name "*.dtb" -o -name "*.dtbo" \) -print

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redmi9a-kernel-dtb-test
          path: artifacts/
