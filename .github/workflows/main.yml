      - name: Locate kernel and DTB
        run: |
          set -e

          mkdir -p work

          echo "======================================"
          echo "SEARCHING DOWNLOADED ARTIFACT"
          echo "======================================"

          find kernel-artifact/extracted \
            -type f \
            -printf '%p\n'

          echo
          echo "======================================"
          echo "SEARCHING FOR KERNEL"
          echo "======================================"

          IMAGE=$(find kernel-artifact/extracted \
            -type f \
            \( -name "Image" -o -name "Image.gz" \) \
            | head -n1)

          if [ -z "$IMAGE" ]; then
            echo "ERROR: Kernel Image/Image.gz not found"
            echo
            echo "All downloaded files were:"
            find kernel-artifact/extracted -type f -print
            exit 1
          fi

          echo "Found kernel:"
          echo "$IMAGE"

          cp "$IMAGE" work/kernel

          echo
          echo "======================================"
          echo "SEARCHING FOR REDMI 9A DTB"
          echo "======================================"

          DTB=$(find kernel-artifact/extracted \
            -type f \
            \( \
              -name "mt6762g-xiaomi-dandelion.dtb" \
              -o -name "dandelion.dtb" \
            \) \
            | head -n1)

          if [ -z "$DTB" ]; then
            echo "ERROR: Redmi 9A DTB not found"
            echo
            echo "All downloaded files were:"
            find kernel-artifact/extracted -type f -print
            exit 1
          fi

          echo "Found DTB:"
          echo "$DTB"

          cp "$DTB" work/dandelion.dtb

          echo
          echo "======================================"
          echo "SELECTED COMPONENTS"
          echo "======================================"

          file work/kernel
          file work/dandelion.dtb

          ls -lh work/
