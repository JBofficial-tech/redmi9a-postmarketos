name: Redmi 9A DTB Deep Comparison

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            device-tree-compiler \
            python3 \
            file \
            binutils

      # --------------------------------------------------
      # Download previously successful mainline kernel artifact
      # --------------------------------------------------
      - name: Download mainline dandelion DTB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p mainline

          gh run download 33749861009 \
            -D mainline \
            || true

          echo "=== DOWNLOADED FILES ==="
          find mainline -type f -maxdepth 5 -print

      # --------------------------------------------------
      # Locate dandelion.dtb from artifact
      # --------------------------------------------------
      - name: Locate mainline DTB
        run: |
          DTB=$(find mainline \
            -type f \
            \( -name "dandelion.dtb" \
            -o -name "mt6762g-xiaomi-dandelion.dtb" \) \
            | head -n 1)

          if [ -z "$DTB" ]; then
            echo "ERROR: mainline dandelion DTB not found"
            exit 1
          fi

          cp "$DTB" mainline-dandelion.dtb

          echo "Mainline DTB:"
          file mainline-dandelion.dtb
          ls -lh mainline-dandelion.dtb

      # --------------------------------------------------
      # Download stock DT extraction artifact
      # --------------------------------------------------
      - name: Download stock DT extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stock

          gh run download 33856392991 \
            -D stock

          echo "=== STOCK ARTIFACT ==="
          find stock -type f -maxdepth 6 -print

      # --------------------------------------------------
      # Locate stock DTS
      # --------------------------------------------------
      - name: Locate stock DTS
        run: |
          STOCK_DTS=$(find stock \
            -type f \
            -name "stock-dandelion.dts" \
            | head -n 1)

          if [ -z "$STOCK_DTS" ]; then
            echo "ERROR: stock-dandelion.dts not found"
            exit 1
          fi

          cp "$STOCK_DTS" stock-dandelion.dts

          echo "Stock DTS:"
          ls -lh stock-dandelion.dts

      # --------------------------------------------------
      # Decompile mainline DTB
      # --------------------------------------------------
      - name: Decompile mainline DTB
        run: |
          dtc \
            -I dtb \
            -O dts \
            mainline-dandelion.dtb \
            -o mainline-dandelion.dts \
            2>&1 | tee mainline-dtc.log || true

          if [ ! -s mainline-dandelion.dts ]; then
            echo "ERROR: Failed to generate mainline DTS"
            exit 1
          fi

          echo "=== MAINLINE DTS ==="
          ls -lh mainline-dandelion.dts

      # --------------------------------------------------
      # Basic DT information
      # --------------------------------------------------
      - name: Generate DT overview
        run: |
          {
            echo "=========================================="
            echo "REDMI 9A DEVICE TREE OVERVIEW"
            echo "=========================================="
            echo

            echo "=== STOCK DTB ==="
            grep -inE \
              'model =|compatible =|bootargs|#address-cells|#size-cells' \
              stock-dandelion.dts \
              | head -100 || true

            echo
            echo "=== MAINLINE DTS ==="
            grep -inE \
              'model =|compatible =|bootargs|#address-cells|#size-cells' \
              mainline-dandelion.dts \
              | head -100 || true

          } | tee dt-overview.txt

      # --------------------------------------------------
      # Extract node names
      # --------------------------------------------------
      - name: Extract node lists
        run: |
          python3 <<'PY'
          import re

          def extract_nodes(path):
              text = open(path, errors="ignore").read()

              nodes = set()

              for line in text.splitlines():
                  line = line.strip()

                  if not line or line.startswith("//"):
                      continue

                  # Remove labels before node declaration
                  line = re.sub(r'^[A-Za-z0-9_]+:\s*', '', line)

                  m = re.match(r'([A-Za-z0-9,._+\-]+(?:@[0-9a-fA-Fx]+)?)\s*\{', line)

                  if m:
                      nodes.add(m.group(1))

              return sorted(nodes)

          stock = extract_nodes("stock-dandelion.dts")
          mainline = extract_nodes("mainline-dandelion.dts")

          open("stock-nodes.txt", "w").write(
              "\n".join(stock) + "\n"
          )

          open("mainline-nodes.txt", "w").write(
              "\n".join(mainline) + "\n"
          )

          print("Stock nodes:", len(stock))
          print("Mainline nodes:", len(mainline))
          PY

      # --------------------------------------------------
      # Compare node names
      # --------------------------------------------------
      - name: Compare node names
        run: |
          comm -23 \
            <(sort stock-nodes.txt) \
            <(sort mainline-nodes.txt) \
            > stock-only-nodes.txt || true

          comm -13 \
            <(sort stock-nodes.txt) \
            <(sort mainline-nodes.txt) \
            > mainline-only-nodes.txt || true

          echo "=== STOCK ONLY NODES ==="
          cat stock-only-nodes.txt

          echo
          echo "=== MAINLINE ONLY NODES ==="
          cat mainline-only-nodes.txt

      # --------------------------------------------------
      # Search important hardware
      # --------------------------------------------------
      - name: Compare important hardware
        run: |
          {
            echo "=========================================="
            echo "IMPORTANT HARDWARE COMPARISON"
            echo "=========================================="
            echo

            for pattern in \
              'uart' \
              'serial' \
              'mmc' \
              'msdc' \
              'ufs' \
              'pinctrl' \
              'gpio' \
              'i2c' \
              'spi' \
              'usb' \
              'xhci' \
              'display' \
              'dsi' \
              'drm' \
              'panel' \
              'backlight' \
              'touch' \
              'tpd' \
              'battery' \
              'charger' \
              'pmic' \
              'mt6357' \
              'regulator' \
              'clk' \
              'clock' \
              'watchdog' \
              'wdt' \
              'thermal' \
              'mali' \
              'gpu' \
              'wifi' \
              'wlan' \
              'bluetooth' \
              'bt' \
              'camera' \
              'sensor' \
              'reserved-memory' \
              'memory@' \
              'chosen'
            do

              echo
              echo "########################################"
              echo "PATTERN: $pattern"
              echo "########################################"

              echo "--- STOCK ---"
              grep -inE "$pattern" \
                stock-dandelion.dts \
                | head -80 || true

              echo "--- MAINLINE ---"
              grep -inE "$pattern" \
                mainline-dandelion.dts \
                | head -80 || true

            done

          } | tee important-hardware.txt

      # --------------------------------------------------
      # Compare compatible strings
      # --------------------------------------------------
      - name: Compare compatible strings
        run: |
          grep -oE \
            'compatible = "[^"]+"' \
            stock-dandelion.dts \
            | sort -u \
            > stock-compatible.txt

          grep -oE \
            'compatible = "[^"]+"' \
            mainline-dandelion.dts \
            | sort -u \
            > mainline-compatible.txt

          comm -23 \
            <(sort stock-compatible.txt) \
            <(sort mainline-compatible.txt) \
            > stock-only-compatible.txt || true

          comm -13 \
            <(sort stock-compatible.txt) \
            <(sort mainline-compatible.txt) \
            > mainline-only-compatible.txt || true

          echo "=== STOCK ONLY COMPATIBLES ==="
          cat stock-only-compatible.txt

          echo
          echo "=== MAINLINE ONLY COMPATIBLES ==="
          cat mainline-only-compatible.txt

      # --------------------------------------------------
      # Compare node properties for important areas
      # --------------------------------------------------
      - name: Generate focused DT report
        run: |
          {
            echo "=========================================="
            echo "REDMI 9A DT DEEP ANALYSIS"
            echo "=========================================="
            echo

            echo "=== STOCK FILE ==="
            wc -l stock-dandelion.dts
            wc -c stock-dandelion.dts

            echo
            echo "=== MAINLINE FILE ==="
            wc -l mainline-dandelion.dts
            wc -c mainline-dandelion.dts

            echo
            echo "=== STOCK NODE COUNT ==="
            wc -l stock-nodes.txt

            echo
            echo "=== MAINLINE NODE COUNT ==="
            wc -l mainline-nodes.txt

            echo
            echo "=== STOCK-ONLY NODE COUNT ==="
            wc -l stock-only-nodes.txt

            echo
            echo "=== MAINLINE-ONLY NODE COUNT ==="
            wc -l mainline-only-nodes.txt

            echo
            echo "=== STOCK-ONLY COMPATIBLE COUNT ==="
            wc -l stock-only-compatible.txt

            echo
            echo "=== MAINLINE-ONLY COMPATIBLE COUNT ==="
            wc -l mainline-only-compatible.txt

          } | tee dt-summary.txt

      # --------------------------------------------------
      # Create unified textual diff
      # --------------------------------------------------
      - name: Create DTS diff
        run: |
          diff -u \
            stock-dandelion.dts \
            mainline-dandelion.dts \
            > stock-vs-mainline.diff \
            || true

          echo "Diff generated:"
          ls -lh stock-vs-mainline.diff

      # --------------------------------------------------
      # Package analysis
      # --------------------------------------------------
      - name: Create comparison package
        run: |
          mkdir -p Redmi9A-DT-Comparison

          cp stock-dandelion.dts \
            Redmi9A-DT-Comparison/

          cp mainline-dandelion.dtb \
            Redmi9A-DT-Comparison/

          cp mainline-dandelion.dts \
            Redmi9A-DT-Comparison/

          cp mainline-dtc.log \
            Redmi9A-DT-Comparison/

          cp dt-overview.txt \
            Redmi9A-DT-Comparison/

          cp stock-nodes.txt \
            Redmi9A-DT-Comparison/

          cp mainline-nodes.txt \
            Redmi9A-DT-Comparison/

          cp stock-only-nodes.txt \
            Redmi9A-DT-Comparison/

          cp mainline-only-nodes.txt \
            Redmi9A-DT-Comparison/

          cp important-hardware.txt \
            Redmi9A-DT-Comparison/

          cp stock-compatible.txt \
            Redmi9A-DT-Comparison/

          cp mainline-compatible.txt \
            Redmi9A-DT-Comparison/

          cp stock-only-compatible.txt \
            Redmi9A-DT-Comparison/

          cp mainline-only-compatible.txt \
            Redmi9A-DT-Comparison/

          cp dt-summary.txt \
            Redmi9A-DT-Comparison/

          cp stock-vs-mainline.diff \
            Redmi9A-DT-Comparison/

          zip -r \
            Redmi9A-DT-Comparison.zip \
            Redmi9A-DT-Comparison

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-DT-Comparison
          path: Redmi9A-DT-Comparison.zip
          retention-days: 14
